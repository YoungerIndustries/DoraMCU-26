    'module-captainslog':      ['com/yisy/modules/doramcu/captainslog/', 'module.captainslog.version', 'CAPTAINS_LOG', "Captain's Log", 'com.yisy.modules.doramcu.captainslog.config.CaptainsLogGameModule'],
    'module-mechwarrior':      ['com/yisy/modules/doramcu/mechwarrior/', 'module.mechwarrior.version', 'MECHWARRIOR', 'MechWarrior', 'com.yisy.modules.doramcu.mechwarrior.config.MechWarriorGameModule'],
