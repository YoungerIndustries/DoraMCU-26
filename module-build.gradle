modulePackages.each { name, config ->
    def pkgPath = config[0]
    def versionProp = config[1]
    def gameType = config[2]
    def moduleName = config[3]
    def mainClass = config[4]

    tasks.register(name, Jar) {
        description = "Builds ${name}.jar from compiled classes"
        group = 'build'
        dependsOn 'generateModuleManifests'
        archiveBaseName = name
        archiveVersion = findProperty(versionProp)
        from sourceSets.main.output.classesDirs
        include "${pkgPath}**"

        // Include META-INF/module.json manifest for hot-swap loading
        def manifestDir = layout.buildDirectory.dir("modules/${name}").get().asFile
        from(manifestDir) {
            include 'module.json'
            into 'META-INF'
        }
    }
}

// Generate module.json manifests for all modules before JAR packaging
// Capture all values at configuration time for configuration cache compatibility
def manifestData = []
modulePackages.each { name, config ->
    def versionProp = config[1]
    def gameType = config[2]
    def moduleName = config[3]
    def mainClass = config[4]
    def version = findProperty(versionProp) as String
    def manifestFile = layout.buildDirectory.file("modules/${name}/module.json").get().asFile
    manifestData << [name: name, gameType: gameType, version: version, moduleName: moduleName, mainClass: mainClass, file: manifestFile]
}

tasks.register('generateModuleManifests') {
    description = 'Generates META-INF/module.json manifests for all module JARs'
    group = 'build'
    manifestData.each { data ->
        outputs.file(data.file)
    }
    doLast {
        manifestData.each { data ->
            data.file.parentFile.mkdirs()
            def content = """{
  "gameType": "${data.gameType}",
  "version": "${data.version}",
  "name": "${data.moduleName}",
  "mechanics": [],
  "dependencies": [],
  "mainClass": "${data.mainClass}"
}"""
            data.file.text = content
        }
    }
}

tasks.register('buildAllModules') {
    description = 'Builds all universe module JARs'
    group = 'build'
    dependsOn classes
    dependsOn 'generateModuleManifests'
    modulePackages.each { name, pkgPath ->
        dependsOn name
    }
}
