server:
  port: 9000

fps:
  server:
    tick-rate: 20
    max-players: 16
    backend-url: http://localhost:8080
    server-port: 9000
    server-id: fps-server-1
    heartbeat-interval: 30
    respawn-time: 5
    match-time-limit: 300
    score-threshold: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.yisy.modules.doramcu.fps: INFO
