services:
  # Nginx reverse proxy - serves the web UI and proxies API requests
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        WEB_ENV: ${WEB_ENV:-dev}
        WEB_API_URL: ${WEB_API_URL:-http://app:8080}
    container_name: doramcu-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
      - neuron
    restart: unless-stopped

  # DoraMCU Neuron - AI satellite node and player gateway
  # Acts as the primary entry point: player login, platform detection,
  # client distribution, and real-time game state synchronization.
  neuron:
    build:
      context: .
      dockerfile: Dockerfile.neuron
    container_name: doramcu-neuron
    ports:
      - "8090:8090"
    environment:
      - NEURON_COORDINATOR_URL=http://app:8080
      - NEURON_GAME_SERVER_URL=http://app:8080
      - NEURON_SECURITY_JWT_SECRET=${NEURON_SECURITY_JWT_SECRET:-}
      - JVM_XMX=-Xmx4G
    depends_on:
      - app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doramcu
    ports:
      - "8080:8080"
      - "${DEBUG_PORT:-5005}:5005"
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - JWT_SECRET=${JWT_SECRET:-}
      - DL_MODE=rest
      - DEBUG=${DEBUG:-}
      - JVM_XMX=-Xmx4G
    depends_on:
      mysql:
        condition: service_healthy
      openhands:
        condition: service_started
      dl:
        condition: service_started
    restart: unless-stopped
    # Memory limits: When DL_MODE=rest, the Python DL service handles ML separately,
    # so the Java app needs less memory (4GB is sufficient).
    # When DL_MODE=local (DL4J in-process), increase to 12GB + swap.
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  mysql:
    image: mysql:8.4
    container_name: doramcu-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-root}
      - MYSQL_DATABASE=doramcu
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  openhands:
    build:
      context: ./dora-ai-openhands
      dockerfile: Dockerfile.openhands
    container_name: doramcu-openhands
    ports:
      - "8082:8082"
    environment:
      - DORA_SERVER_PORT=8082
      - DORA_WORKSPACE=/workspace
      - LLM_MODEL=${LLM_MODEL:-ollama/qwen2.5:14b}
      - LLM_API_KEY=${LLM_API_KEY:-ollama}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - ./dora-ai-openhands:/app
      - ./src:/workspace
    restart: unless-stopped

  dl:
    build:
      context: ./dora-dl-python
      dockerfile: Dockerfile.dl
    container_name: doramcu-dl
    ports:
      - "8083:8083"
    volumes:
      - ./dl-models:/app/dl-models
    environment:
      - DORA_DL_PORT=8083
      - DL_MODEL_DIR=/app/dl-models
      - DL_BLEND_FACTOR=0.5
    restart: unless-stopped

  # Redis - for distributed event bus and cache (optional, enable for multi-process mode)
  redis:
    image: redis:7-alpine
    container_name: doramcu-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
