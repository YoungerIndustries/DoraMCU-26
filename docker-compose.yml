# =============================================================================
# DoraMCU Docker Compose — Base Configuration (Development Defaults)
# =============================================================================
# Base services with dev defaults. Override files extend this for prod/pi.
#
# Usage:
#   Dev (default):    docker compose up -d
#   Production:       docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   Raspberry Pi:     docker compose -f docker-compose.yml -f docker-compose.pi.yml up -d
#   Debug (OpenHands): docker compose --profile debug up -d
# =============================================================================

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Nginx reverse proxy
  # ─────────────────────────────────────────────────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        WEB_ENV: ${WEB_ENV:-dev}
        WEB_API_URL: ${WEB_API_URL:-http://app:8080}
    container_name: doramcu-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
      - neuron
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # DoraMCU Neuron (AI inference)
  # ─────────────────────────────────────────────────────────────────────────────
  neuron:
    build:
      context: .
      dockerfile: Dockerfile.neuron
    container_name: doramcu-neuron
    ports:
      - "8090:8090"
    environment:
      - NEURON_COORDINATOR_URL=http://app:8080
      - NEURON_GAME_SERVER_URL=http://app:8080
      - NEURON_SECURITY_JWT_SECRET=${NEURON_SECURITY_JWT_SECRET:-}
      - JVM_XMX=-Xmx512m
    depends_on:
      - app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ─────────────────────────────────────────────────────────────────────────────
  # DoraMCU App (Spring Boot server)
  # ─────────────────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doramcu
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker,production
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - JWT_SECRET=${JWT_SECRET:-}
      - DL_MODE=rest
      - DEBUG=${DEBUG:-}
      - JVM_XMX=-Xmx1G
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      dl:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ─────────────────────────────────────────────────────────────────────────────
  # MySQL database
  # ─────────────────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: doramcu-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-root}
      - MYSQL_DATABASE=doramcu
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  # ─────────────────────────────────────────────────────────────────────────────
  # DL Python service (Deep Learning)
  # ─────────────────────────────────────────────────────────────────────────────
  dl:
    build:
      context: ./dora-dl-python
      dockerfile: Dockerfile.dl
    container_name: doramcu-dl
    ports:
      - "8083:8083"
    volumes:
      - ./dl-models:/app/dl-models
    environment:
      - DORA_DL_PORT=8083
      - DL_MODEL_DIR=/app/dl-models
      - DL_BLEND_FACTOR=0.5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ─────────────────────────────────────────────────────────────────────────────
  # Redis cache
  # ─────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: doramcu-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # ─────────────────────────────────────────────────────────────────────────────
  # Dora News Network (standalone proxy + frontend for news API)
  # ─────────────────────────────────────────────────────────────────────────────
  news-network:
    build:
      context: ./dora-news-network
      dockerfile: Dockerfile.simpler
    container_name: doramcu-news-network
    ports:
      - "8084:8084"
    environment:
      - DORA_MCU_SERVER_URL=http://app:8080
    depends_on:
      - app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # ─────────────────────────────────────────────────────────────────────────────
  # OpenHands AI — Debug profile only (development-only service)
  # ─────────────────────────────────────────────────────────────────────────────
  openhands:
    build:
      context: ./dora-ai-openhands
      dockerfile: Dockerfile.openhands
    container_name: doramcu-openhands
    ports:
      - "8082:8082"
    environment:
      - DORA_SERVER_PORT=8082
      - DORA_WORKSPACE=/workspace
      - LLM_MODEL=${LLM_MODEL:-ollama/qwen2.5:14b}
      - LLM_API_KEY=${LLM_API_KEY:-ollama}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - ./dora-ai-openhands:/app
      - ./src:/workspace
    restart: unless-stopped
    profiles:
      - debug

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  dl-models:
    driver: local
