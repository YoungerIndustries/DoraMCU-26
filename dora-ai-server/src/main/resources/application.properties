# DoraAI Server Configuration
server.port=8085

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# AI Provider Configuration
# Default AI provider: ollama, gemini, deepseek
ai.provider.default=ollama

# Ollama Configuration
ollama.base-url=http://localhost:11434
ollama.model=qwen2.5:14b
ollama.whisper-model=whisper
ollama.tts-model=kant
ollama.tts-voice=en
ollama.connect-timeout-ms=5000
ollama.read-timeout-ms=120000

# DeepSeek Configuration
deepseek.enabled=false
deepseek.api-key=
deepseek.base-url=https://api.deepseek.com
deepseek.model=deepseek-chat

# Gemini Configuration
gemini.enabled=false
gemini.api-key=
gemini.model=gemini-pro

# OpenHands Configuration
openhands.enabled=false
openhands.base-url=http://localhost:8082

# Logging
logging.level.com.yisy.modules.doraai=INFO
logging.level.root=INFO
