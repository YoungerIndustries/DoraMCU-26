    def jvmArgsList = findProperty('app.jvm.args').toString().split(' ') +
                      findProperty('app.javacpp.args').toString().split(' ')
    jvmArgs(jvmArgsList)
}

// Build the standalone desktop distribution (Electron + embedded Spring Boot JAR)
tasks.register('buildDesktop', Exec) {
    description = 'Builds the standalone DoraMCU Desktop app (Electron + embedded Spring Boot JAR)'
    group = 'build'
    dependsOn bootJar

    // Copy the JAR to dora-electron/server/ for electron-builder
    doFirst {
        def jarDir = file('build/libs')
        def serverDir = file('dora-electron/server')
        serverDir.mkdirs()
        def jarFile = jarDir.listFiles()?.findAll { it.name.endsWith('.jar') && !it.name.endsWith('.sources.jar') && !it.name.endsWith('.javadoc.jar') && !it.name.contains('-plain.jar') }
            ?.sort { it.length() }?.last()
        if (jarFile) {
            copy {
                from jarFile
                into serverDir
            }
            logger.lifecycle("Copied ${jarFile.name} to dora-electron/server/")
        } else {
            throw new GradleException('No Spring Boot JAR found in build/libs. Run bootJar first.')
        }
    }

    if (System.properties['os.name'].toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'cd dora-electron && npm run build'
    } else {
        commandLine 'sh', '-c', 'cd dora-electron && npm run build'
    }
}

// Quick desktop dev mode: build JAR and copy to dora-electron/server/ without full electron-builder
tasks.register('prepareDesktopDev') {
    description = 'Prepares the Spring Boot JAR for desktop development (copy to dora-electron/server/)'
    group = 'build'
    dependsOn bootJar

    doLast {
        def jarDir = file('build/libs')
        def serverDir = file('dora-electron/server')
        serverDir.mkdirs()
        def jarFile = jarDir.listFiles()?.findAll { it.name.endsWith('.jar') && !it.name.endsWith('.sources.jar') && !it.name.endsWith('.javadoc.jar') && !it.name.contains('-plain.jar') }
            ?.sort { it.length() }?.last()
        if (jarFile) {
            copy {
                from jarFile
                into serverDir
            }
            logger.lifecycle("Copied ${jarFile.name} to dora-electron/server/ — run 'npm start' in dora-electron/")
        } else {
            throw new GradleException('No Spring Boot JAR found in build/libs.')
        }
    }
}

// ---- JaCoCo Code Coverage Configuration ----

jacoco {
    toolVersion = '0.8.15'
}

tasks.named('test') {
    // Exclude JDK bootstrap classes from instrumentation (required for Java 27+)
    jacoco {
        excludes = ['sun/**', 'jdk/**', 'java/**', 'javax/**', 'com/sun/**', 'com/oracle/**']
    }
}

def jacocoExcludes = [
    '**/*Controller.class',
    '**/*Controller$*.class',
    '**/*Dto.class',
    '**/*DTO.class',
    '**/*DTO$*.class',
    '**/*Config.class',
    '**/*Config$*.class',
    '**/*Initializer.class',
    '**/*Initializer$*.class',
    '**/model/**',
    '**/dto/**',
    '**/config/**',
    '**/*Application.class',
    '**/*WebSocketHandler.class',
    '**/*WebSocketHandler$*.class'
]

tasks.named('jacocoTestReport') {
    // Include dora-neuron module in coverage aggregation
    executionData(fileTree(dir: 'dora-neuron', includes: ['**/jacoco/test.exec']))

    // Exclude infrastructure code from coverage: controllers, DTOs, configs, data initializers, models
    classDirectories.setFrom(classDirectories.files.collect {
        fileTree(dir: it, excludes: jacocoExcludes)
    })
    reports {
        xml.required.set(true)
        html.required.set(true)
        html.outputLocation.set(layout.buildDirectory.dir('jacocoHtml'))
    }
}

tasks.named('jacocoTestCoverageVerification') {
    // Exclude the same infrastructure code from verification
    classDirectories.setFrom(classDirectories.files.collect {
        fileTree(dir: it, excludes: jacocoExcludes)
    })
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.50  // Realistic target: 50% line coverage
            }
        }
        rule {
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.30  // Realistic target: 30% branch coverage
            }
        }
    }
}

tasks.named('check') {
    dependsOn 'jacocoTestReport'
}

// ---- Web Client Configuration Generation ----

// Capture all values at configuration time for configuration cache compatibility
def webEnv = findProperty('web.env') ?: 'dev'
def webApiUrl = findProperty('web.api.url')
def webDefaultApiUrls = [
    'dev':    'http://localhost:8080',
    'staging': 'https://staging-api.doramcu.com',
    'prod':   'https://api.doramcu.com'
]
if (!webApiUrl) {
    webApiUrl = webDefaultApiUrls.get(webEnv, webDefaultApiUrls['dev'])
}
def webAppVersion = findProperty('app.version') as String
def webOutputFile = file('dora-web/config.json')
def webOutputDir = file('dora-web')

tasks.register('generateWebConfig') {
    description = 'Generates dora-web/config.json with environment-specific API URL'
    group = 'build'
    outputs.file webOutputFile

    doLast {
        webOutputDir.mkdirs()
        // Load client metadata from template
        def templateFile = file('dora-web/clients-template.json')
        if (!templateFile.exists()) {
            throw new GradleException("Client template not found: ${templateFile.path}")
        }
        def jsonSlurper = new groovy.json.JsonSlurper()
        def template = jsonSlurper.parse(templateFile)

        def config = [
            apiUrl: webApiUrl,
            version: webAppVersion,
            clients: template.clients
        ]
        // Write JSON using Groovy's JsonOutput
        def json = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config))
        webOutputFile.text = json
        logger.lifecycle("Generated ${webOutputFile.path} for environment '${webEnv}' with apiUrl=${webApiUrl}")
    }
}

// Generate dev config by default when building
tasks.register('prepareWebClient') {
    description = 'Prepares the web client for deployment (generates config.json)'
    group = 'build'
    dependsOn 'generateWebConfig'
}

// ---- Production Build Task ----

tasks.register('productionBuild') {
    description = 'Builds a production-optimized JAR (excludes tests, sets production profile)'
    group = 'build'
    dependsOn 'bootJar'

    doFirst {
        // Set production profile system property
        System.setProperty('spring.profiles.active', 'production')
        logger.lifecycle('Building production JAR with profile: production')
    }
}

// Production JAR that excludes test dependencies and enables optimization
tasks.named('bootJar') {
    // Include rule files in the JAR
    from('starship-troopers-rules') {
        into('starship-troopers-rules')
    }
    from('star-wars-rules') {
        into('star-wars-rules')
    }
}

// ---- OWASP Dependency-Check Configuration ----

dependencyCheck {
    failBuildOnCVSS = 9  // Fail only on CRITICAL (9-10)
    suppressionFile = 'dependencycheck-suppressions.xml'
    analyzers {
        nodeAudit.enabled = false  // Skip Node.js audit (no package.json in root)
    }
    format = 'ALL'
}
