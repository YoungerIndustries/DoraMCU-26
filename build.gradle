plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'org.owasp.dependencycheck' version '11.1.0'
}

application {
    mainClass = 'com.yisy.modules.doramcu.DoraMcuLauncher'
}

bootRun {
    mainClass = 'com.yisy.modules.doramcu.DoraMcuLauncher'
    systemProperty 'doramcu.development', 'true'
    systemProperty 'doramcu.launcher.mode', 'desktop'
    systemProperty 'doramcu.launcher.skip-headless-check', 'true'
}

group = 'com.YISY.modules'
version = findProperty('app.version')
description = 'DoraMCU'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(findProperty('java.version').toString().toInteger())
    }
    sourceSets {
        main {
            resources {
                srcDirs = ['src/main/resources']
            }
        }
        test {
            java {
            }
        }
    }
}

tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // Place rule files into subdirectories to avoid name collisions
    into('starship-troopers-rules') {
        from('starship-troopers-rules')
    }
    into('star-wars-rules') {
        from('star-wars-rules')
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Neuron module — player gateway, client distribution, game sync
    implementation project(':dora-neuron')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation "com.github.ben-manes.caffeine:caffeine:${findProperty('caffeine.version')}"
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    // OpenAPI 3.0 documentation (SpringDoc)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    // Kafka - optional, only needed when neuron.kafka.enabled=true
    compileOnly 'org.springframework.kafka:spring-kafka'
    // Redis - for distributed event bus and cache (required in Docker/K8s deployments)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // JSON logging for production (Logstash encoder for ELK/Grafana Loki)
    implementation "net.logstash.logback:logstash-logback-encoder:${findProperty('logstash.logback.version')}"
    implementation "io.jsonwebtoken:jjwt-api:${findProperty('jjwt.version')}"
    
    // Google Maps API for accurate terrain and city data
    implementation 'com.google.maps:google-maps-services:2.2.0'
    
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${findProperty('jjwt.version')}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${findProperty('jjwt.version')}"

    // Deeplearning4j for local DL mode (when dl.rest-client.enabled=false)
    implementation "org.deeplearning4j:deeplearning4j-core:${findProperty('dl4j.version')}"
    implementation "org.deeplearning4j:deeplearning4j-nn:${findProperty('dl4j.version')}"
    implementation "org.nd4j:nd4j-native-platform:${findProperty('dl4j.version')}"

    // Caffeine cache (also used by dora-ai)
    // Already declared above

    // SLF4J (for FPS core)
    // Already provided by Spring Boot

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
}

