# =============================================================================
# DoraMCU Production Profile Configuration
# =============================================================================
# This profile is for production deployments where performance, security, and
# stability are the top priorities. It overrides the default and dev profiles.
# =============================================================================

# --- Active Profile ---
# In production, explicitly set the profile via environment variable:
#   SPRING_PROFILES_ACTIVE=production
# or via K8s ConfigMap / docker-compose environment.

# --- Logging ---
# Reduce verbosity in production to improve performance and reduce log volume.
logging.level.root=WARN
logging.level.com.yisy.modules.doramcu=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# Disable Spring Boot default file logging (handled by logback-spring.xml JSON_FILE appender)
logging.file.name=
logging.file.path=

# Compact console logging pattern for log aggregation (ELK/Grafana Loki)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# --- Actuator Endpoints ---
# Narrow actuator exposure in production for security.
# Only health, info, metrics, and prometheus are exposed.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.show-components=when_authorized
management.endpoint.shutdown.enabled=false

# --- Database ---
# HikariCP — tune for production load
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA — update schema to handle existing database
# The Pi has a pre-built H2 database with existing indexes.
# 'update' lets Hibernate adapt without failing on duplicate indexes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Flyway enabled with baseline mode - Hibernate manages existing schema,
# Flyway manages future migrations only. Baseline treats current schema as V999.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=999
spring.flyway.baseline-description=Baseline from Hibernate-managed H2 schema

# --- Cache ---
# Larger cache sizes for production traffic
spring.cache.caffeine.spec=maximumSize=5000,expireAfterWrite=3600s

# --- DL Memory Guard ---
# Enable memory guard to prevent OOM crashes in production
dl.memory-guard.enabled=true
dl.memory-guard.min-free-memory-mb=1024
dl.memory-guard.max-physical-memory-mb=8192

# --- Launcher Mode ---
# Production runs in server mode only (no desktop/Electron)
doramcu.launcher.mode=server

# --- Disable Development-Only Features ---
# OpenHands and DeepSeek are development tools, not needed in production
openhands.enabled=false
deepseek.enabled=false

# --- Security ---
# Enforce HTTPS redirects in production (set to true when behind TLS termination)
server.forward-headers-strategy=framework

# --- Circular Dependencies ---
# Allow circular references for galaxy service cycle (aiAdminService <-> economicManagerService)
spring.main.allow-circular-references=true

# --- Spring Boot 4 Compatibility ---

# JWT Configuration — default provided in JwtService.java
# Override by setting JWT_SECRET environment variable

# Game State Snapshots — periodic save of active sessions (more frequent in production)
doramcu.snapshot.enabled=true
doramcu.snapshot.interval=300000

# Galaxy auto-generation — creates galaxies for all registered game modules
# and generates solar systems in the background after startup.
doramcu.galaxy.auto-generate=true
doramcu.galaxy.multi-galaxy.enabled=true
