# MySQL Profile — Standard Database Configuration (used on all platforms)
# Activate with: spring.profiles.active=mysql
spring.datasource.url=jdbc:mysql://localhost:3306/doramcu?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=doramcu
spring.datasource.password=${DB_PASSWORD:change-me-in-production}

# JPA Configuration — Hibernate manages schema (Flyway has MySQL 8.4 syntax issues)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway enabled with baseline mode - Hibernate manages existing schema,
# Flyway manages future migrations only. Baseline treats current schema as V999.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=999
spring.flyway.baseline-description=Baseline from Hibernate-managed H2 schema

# JWT Configuration — default provided in JwtService.java
# Override by setting JWT_SECRET environment variable
