# Development Profile - H2 File-Based Database (persistent across restarts)
spring.main.allow-bean-definition-overriding=true
spring.datasource.url=jdbc:h2:file:./data/doramcu
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration - update schema for file-based H2 dev database
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# H2 doesn't support native ENUM types — force Hibernate to use VARCHAR for enums
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway enabled with baseline mode - Hibernate manages existing schema,
# Flyway manages future migrations only. Baseline treats current schema as V999.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=999
spring.flyway.baseline-description=Baseline from Hibernate-managed H2 schema

# H2 Console (optional, for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Enable seed data for development environment
app.seed-data=true

# Enable galaxy auto-generation for file-based H2 dev database
# (Only generates on first run; data persists across restarts)
doramcu.galaxy.auto-generate=true

# Enable multi-galaxy startup queue
# Creates galaxies for all registered game modules in priority order:
# Earth2026 (1) → Traveller (2) → D&D (3) → Star Trek (4) → Babylon 5 (5)
doramcu.galaxy.multi-galaxy.enabled=true

# Allow Flyway clean in dev only (disabled in production by default)
spring.flyway.clean-disabled=false

# Game State Snapshots — periodic save of active sessions
doramcu.snapshot.enabled=true
doramcu.snapshot.interval=300000
