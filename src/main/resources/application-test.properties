# Test Profile — PC Local Testing Server
# Runs on port 8081 with separate H2 database for pre-deployment testing
# Usage: java -Xms1g -Xmx2g -jar DoraMCU-0.6.0.jar --spring.profiles.active=test

server.port=8081

# Allow overriding references for test environment
spring.main.allow-bean-definition-overriding=true

# H2 File-Based Database — separate from production database
spring.datasource.url=jdbc:h2:file:./data/doramcu-test
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration — update schema for test database
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway enabled with baseline mode - Hibernate manages existing schema,
# Flyway manages future migrations only. Baseline treats current schema as V999.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=999
spring.flyway.baseline-description=Baseline from Hibernate-managed H2 schema

# H2 Console for test database debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Enable seed data and galaxy auto-generation for test environment
app.seed-data=true
doramcu.galaxy.auto-generate=true
doramcu.galaxy.multi-galaxy.enabled=true

# Allow Flyway clean in test only
spring.flyway.clean-disabled=false

# Logging — mark test server logs for easy identification
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [TEST] [%thread] [%X{correlationId:-}] %-5level %logger{36} - %msg%n
logging.file.name=logs/doramcu-test.log

# Game State Snapshots — disabled in test profile to avoid interference
doramcu.snapshot.enabled=false
