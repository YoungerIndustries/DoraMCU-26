# Docker Profile — Containerized Environment Configuration
# Activate with: spring.profiles.active=docker
# Overrides localhost connections to use Docker service hostnames

# MySQL — connect to the mysql service container
spring.datasource.url=jdbc:mysql://mysql:3306/doramcu?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=doramcu
spring.datasource.password=${DB_PASSWORD:doramcu-prod-2026-secure}

# JPA Configuration — Hibernate manages schema (Flyway has MySQL 8.4 syntax issues)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway enabled with baseline mode - Hibernate manages existing schema,
# Flyway manages future migrations only. Baseline treats current schema as V999.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=999
spring.flyway.baseline-description=Baseline from Hibernate-managed H2 schema

# JWT Configuration — default provided in JwtService.java
# Override by setting JWT_SECRET environment variable

# Redis — connect to the redis service container
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.timeout=5000
