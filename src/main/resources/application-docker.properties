# Docker Profile — Containerized Environment Configuration
# Activate with: spring.profiles.active=docker
# Overrides localhost connections to use Docker service hostnames

# MySQL — connect to the mysql service container
spring.datasource.url=jdbc:mysql://mysql:3306/doramcu
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

# JPA Configuration — Flyway manages schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# Redis — connect to the redis service container
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.timeout=5000
