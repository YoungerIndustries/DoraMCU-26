<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoraMCU 3D World</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
        
        #gameCanvas { display: block; width: 100vw; height: 100vh; }
        
        /* HUD Overlay */
        #hud {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }
        
        /* Crosshair */
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 20px; height: 20px;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(255,255,255,0.8);
        }
        #crosshair::before {
            top: 50%; left: 0; width: 100%; height: 2px;
            transform: translateY(-50%);
        }
        #crosshair::after {
            top: 0; left: 50%; width: 2px; height: 100%;
            transform: translateX(-50%);
        }
        
        /* Health Bar */
        #healthBar {
            position: absolute; bottom: 30px; left: 30px;
            width: 250px; height: 20px; background: rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.3); border-radius: 4px;
            overflow: hidden;
        }
        #healthFill {
            height: 100%; width: 100%; background: linear-gradient(90deg, #ff4444, #44ff44);
            transition: width 0.3s ease;
        }
        #healthText {
            position: absolute; bottom: 55px; left: 30px;
            color: #fff; font-size: 14px; text-shadow: 1px 1px 2px #000;
        }
        
        /* Ammo Counter */
        #ammoCounter {
            position: absolute; bottom: 30px; right: 30px;
            color: #fff; font-size: 28px; font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }
        #weaponName {
            position: absolute; bottom: 65px; right: 30px;
            color: #aaa; font-size: 14px; text-shadow: 1px 1px 2px #000;
        }
        
        /* Score */
        #scoreDisplay {
            position: absolute; top: 20px; left: 50%;
            transform: translateX(-50%);
            color: #fff; font-size: 18px; text-align: center;
            text-shadow: 2px 2px 4px #000;
        }
        
        /* Kill Feed */
        #killFeed {
            position: absolute; top: 20px; right: 20px;
            width: 250px;
        }
        .kill-feed-item {
            background: rgba(0,0,0,0.6); color: #fff; padding: 5px 10px;
            margin-bottom: 4px; border-radius: 3px; font-size: 12px;
            animation: fadeOut 5s forwards;
        }
        @keyframes fadeOut {
            0%, 70% { opacity: 1; }
            100% { opacity: 0; }
        }
        
        /* Damage Overlay */
        #damageOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(255,0,0,0.4) 100%);
            opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 5;
        }
        
        /* Minimap */
        #minimap {
            position: absolute; top: 20px; left: 20px;
            width: 150px; height: 150px;
            background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%; overflow: hidden;
        }
        #minimapCanvas { width: 100%; height: 100%; }
        
        /* Reload Indicator */
        #reloadIndicator {
            position: absolute; top: 60%; left: 50%;
            transform: translateX(-50%);
            color: #ffaa00; font-size: 16px;
            text-shadow: 1px 1px 2px #000;
            display: none;
        }
        
        /* Lobby Screen */
        #lobbyScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; z-index: 100;
        }
        #lobbyScreen h1 {
            color: #fff; font-size: 48px; margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(100,200,255,0.5);
        }
        #lobbyScreen p { color: #888; margin-bottom: 30px; }
        .lobby-btn {
            background: linear-gradient(135deg, #0f3460, #16213e);
            color: #fff; border: 1px solid rgba(100,200,255,0.3);
            padding: 12px 30px; margin: 5px; font-size: 16px;
            border-radius: 5px; cursor: pointer; pointer-events: auto;
            transition: all 0.3s;
        }
        .lobby-btn:hover {
            background: linear-gradient(135deg, #16213e, #0f3460);
            border-color: rgba(100,200,255,0.6);
            box-shadow: 0 0 15px rgba(100,200,255,0.3);
        }
        .lobby-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #lobbyStatus { color: #888; margin-top: 20px; font-size: 14px; }
        #matchList {
            max-height: 200px; overflow-y: auto; margin: 15px 0;
            width: 400px; max-width: 90vw;
        }
        .match-item {
            background: rgba(255,255,255,0.05); padding: 10px 15px;
            margin: 5px 0; border-radius: 5px; cursor: pointer;
            color: #ccc; transition: background 0.2s;
        }
        .match-item:hover { background: rgba(255,255,255,0.1); }
        
        /* Death Screen */
        #deathScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(139,0,0,0.7); display: none;
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 50;
        }
        #deathScreen h2 { color: #fff; font-size: 36px; margin-bottom: 20px; }
        #respawnTimer { color: #ffaa00; font-size: 24px; }
        
        /* Player Count */
        #playerCount {
            position: absolute; bottom: 30px; left: 50%;
            transform: translateX(-50%);
            color: #aaa; font-size: 14px; text-shadow: 1px 1px 2px #000;
        }
        
        /* CTP Team Scores */
        #ctpScores {
            position: absolute; top: 10px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 20px; align-items: center;
            color: #fff; font-size: 18px; font-weight: bold;
            text-shadow: 1px 1px 3px #000;
            display: none;
        }
        #team0Score { color: #0066ff; }
        #team1Score { color: #ff3333; }
        #ctpModeLabel { color: #ffaa00; font-size: 14px; }
        
        /* CTP Capture Points */
        #capturePointsContainer {
            position: absolute; top: 45px; left: 50%;
            transform: translateX(-50%);
            display: none; gap: 10px; align-items: center;
        }
        .capture-point-status {
            display: flex; flex-direction: column; align-items: center;
            background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 4px;
        }
        .cp-label { font-size: 12px; font-weight: bold; margin-bottom: 2px; }
        .cp-bar-bg {
            width: 60px; height: 6px; background: #333; border-radius: 3px;
            overflow: hidden;
        }
        .cp-bar-fill {
            height: 100%; width: 0%; transition: width 0.2s;
        }
    </style>
</head>
<body>
    <!-- 3D Canvas -->
    <canvas id="gameCanvas"></canvas>
    
    <!-- Damage Overlay -->
    <div id="damageOverlay"></div>
    
    <!-- HUD -->
    <div id="hud" style="display:none;">
        <div id="crosshair"></div>
        
        <div id="healthText">Health: 100</div>
        <div id="healthBar"><div id="healthFill"></div></div>
        
        <div id="weaponName">Pistol</div>
        <div id="ammoCounter">12 / 60</div>
        
        <div id="scoreDisplay">
            <span id="scoreText">Score: 0</span> | 
            <span id="matchTimer">05:00</span>
        </div>
        
        <!-- CTP Team Scores -->
        <div id="ctpScores">
            <span id="team0Score">0</span>
            <span id="ctpModeLabel">CTP</span>
            <span id="team1Score">0</span>
        </div>
        
        <!-- CTP Capture Points -->
        <div id="capturePointsContainer"></div>
        
        <div id="killFeed"></div>
        
        <div id="minimap">
            <canvas id="minimapCanvas" width="150" height="150"></canvas>
        </div>
        
        <div id="reloadIndicator">RELOADING...</div>
        <div id="playerCount">Players: 0</div>
    </div>
    
    <!-- Death Screen -->
    <div id="deathScreen">
        <h2>YOU DIED</h2>
        <div id="respawnTimer">Respawning in 5...</div>
    </div>
    
    <!-- Lobby Screen -->
    <div id="lobbyScreen">
        <h1>DoraMCU 3D World</h1>
        <p>3D RPG First-Person World</p>
        
        <div>
            <button class="lobby-btn" id="btnCreateMatch">Create Match</button>
            <button class="lobby-btn" id="btnJoinMatch">Quick Join</button>
            <button class="lobby-btn" id="btnReady" disabled>Ready</button>
        </div>
        
        <div id="matchList"></div>
        
        <div id="lobbyStatus">Loading 3D world...</div>
    </div>
    
    <!-- Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- FPS Modules -->
    <script src="fpsNetwork.js"></script>
    <script src="fpsState.js"></script>
    <script src="fpsMap.js"></script>
    <script src="fpsSceneDecorator.js"></script>
    <script src="fpsOfficeDecorator.js"></script>
    <script src="fpsSceneObjectLoader.js"></script>
    <script src="fpsTransition.js"></script>
    <script src="fpsPlayer.js"></script>
    <script src="fpsWeapon.js"></script>
    <script src="fpsGame.js"></script>
</body>
</html>
