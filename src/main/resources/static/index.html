<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoraMCU - Do You Want To Live Forever?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0a 70%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e0e0e0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 800px;
            padding: 2rem;
            animation: fadeIn 2s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question {
            font-size: 4rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #00d4ff, #7b2ff7, #ff2d95);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
        }

        .tagline {
            font-size: 1.5rem;
            color: #b0b0b0;
            margin-bottom: 3rem;
            font-style: italic;
        }

        .buttons {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-bottom: 4rem;
        }

        .btn {
            padding: 1rem 3rem;
            font-size: 1.5rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 150px;
        }

        .btn-yes {
            background: linear-gradient(135deg, #00c853, #00e676);
            color: #0a0a0a;
            box-shadow: 0 4px 20px rgba(0, 200, 83, 0.3);
        }

        .btn-yes:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(0, 200, 83, 0.5);
        }

        .btn-no {
            background: linear-gradient(135deg, #d50000, #ff1744);
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(213, 0, 0, 0.3);
        }

        .btn-no:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(213, 0, 0, 0.5);
        }

        .attribution {
            font-size: 0.9rem;
            color: #666;
            margin-top: 2rem;
        }

        .attribution a {
            color: #00d4ff;
            text-decoration: none;
        }

        .attribution a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .question {
                font-size: 2.5rem;
            }
            .tagline {
                font-size: 1.2rem;
            }
            .buttons {
                flex-direction: column;
                gap: 1rem;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="question">Do You Want To Live Forever...?</h1>
        <p class="tagline">Enter the DoraMCU Universe and Become Immortal!</p>
        <div class="buttons">
            <button class="btn btn-yes" type="button">Yes</button>
            <button class="btn btn-no" type="button">No</button>
        </div>
        <p class="attribution">
            Brought to You by Younger Industries and The Younger Industries Ship Yards<br>
            <a href="https://eveonline.com" target="_blank" rel="noopener">[EVE Online YISY]</a>
        </p>
    </div>
</body>
</html>
