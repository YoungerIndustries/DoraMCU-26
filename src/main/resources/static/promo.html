<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoraMCU — Access Code or Payment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* ── Background ── */
        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at center, #1a0a2e 0%, #0a0a1a 60%, #000 100%);
        }

        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-image:
                linear-gradient(rgba(138, 43, 226, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(138, 43, 226, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* ── Main Container ── */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            padding: 1rem;
        }

        /* ── Header ── */
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(90deg, #b388ff, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #888;
            font-size: 0.95rem;
        }

        /* ── Step Indicator ── */
        .steps {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .step-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #333;
            transition: all 0.3s;
        }

        .step-dot.active {
            background: #b388ff;
            box-shadow: 0 0 10px rgba(179, 136, 255, 0.5);
        }

        .step-dot.completed {
            background: #00c853;
        }

        /* ── Card ── */
        .card {
            background: linear-gradient(135deg, #12121f 0%, #1a1a2e 100%);
            border: 1px solid #2a2a3e;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 0 40px rgba(138, 43, 226, 0.1);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ccc;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        /* ── Promo Code Section ── */
        .promo-section {
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group input {
            width: 100%;
            background: #0a0a15;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 0.8rem 1rem;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #b388ff;
            box-shadow: 0 0 10px rgba(179, 136, 255, 0.2);
        }

        .input-group input::placeholder {
            color: #555;
        }

        .validate-btn {
            width: 100%;
            background: linear-gradient(135deg, #8a2be2, #4b0082);
            border: 1px solid #b388ff;
            color: #fff;
            padding: 0.8rem;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .validate-btn:hover {
            background: linear-gradient(135deg, #9b30ff, #6a0dad);
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.4);
        }

        .validate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .promo-result {
            margin-top: 0.8rem;
            padding: 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
            text-align: center;
            display: none;
        }

        .promo-result.success {
            display: block;
            background: rgba(0, 200, 83, 0.1);
            border: 1px solid rgba(0, 200, 83, 0.3);
            color: #00c853;
        }

        .promo-result.error {
            display: block;
            background: rgba(255, 45, 85, 0.1);
            border: 1px solid rgba(255, 45, 85, 0.3);
            color: #ff2d55;
        }

        /* ── Divider ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 2rem 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, #333, transparent);
        }

        .divider-text {
            font-size: 0.8rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* ── Payment Methods ── */
        .payment-section h3 {
            font-size: 0.9rem;
            color: #888;
            text-align: center;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .payment-methods {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .payment-method {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: #0a0a15;
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            padding: 1rem 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .payment-method:hover {
            border-color: #b388ff;
            background: rgba(138, 43, 226, 0.05);
            transform: translateX(4px);
        }

        .payment-method.selected {
            border-color: #00c853;
            background: rgba(0, 200, 83, 0.05);
        }

        .payment-icon {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .payment-icon.paypal {
            background: linear-gradient(135deg, #003087, #009cde);
            color: #fff;
        }

        .payment-icon.google-pay {
            background: linear-gradient(135deg, #4285f4, #34a853);
            color: #fff;
        }

        .payment-icon.chime {
            background: linear-gradient(135deg, #00c853, #00e676);
            color: #fff;
        }

        .payment-info {
            flex: 1;
        }

        .payment-name {
            font-size: 1rem;
            font-weight: 600;
            color: #e0e0e0;
        }

        .payment-desc {
            font-size: 0.8rem;
            color: #666;
            margin-top: 0.2rem;
        }

        .payment-check {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .payment-method.selected .payment-check {
            border-color: #00c853;
            background: #00c853;
        }

        .payment-method.selected .payment-check::after {
            content: '✓';
            color: #fff;
            font-size: 0.8rem;
            font-weight: 700;
        }

        /* ── Continue Button ── */
        .continue-btn {
            width: 100%;
            margin-top: 2rem;
            background: linear-gradient(135deg, #ff6b35, #ff2d55);
            border: none;
            color: #fff;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.3);
        }

        .continue-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(255, 107, 53, 0.5);
        }

        .continue-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* ── Skip Link ── */
        .skip-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .skip-link a {
            color: #666;
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s;
        }

        .skip-link a:hover {
            color: #b388ff;
        }

        /* ── Loading Spinner ── */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 0.5rem;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── Responsive ── */
        @media (max-width: 500px) {
            .card {
                padding: 1.5rem;
            }
            .header h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="bg-grid"></div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Choose Your Path</h1>
            <p>Enter a promo code or select a payment method to continue</p>
        </div>

        <!-- Step Indicator -->
        <div class="steps">
            <div class="step-dot completed" title="Door"></div>
            <div class="step-dot active" title="Access"></div>
            <div class="step-dot" title="Register"></div>
            <div class="step-dot" title="Character"></div>
            <div class="step-dot" title="Earth 2026"></div>
        </div>

        <!-- Main Card -->
        <div class="card">
            <div class="card-title">🔑 Access the Game</div>

            <!-- Promo Code Section -->
            <div class="promo-section">
                <div class="input-group">
                    <label for="promoCode">Promo Code</label>
                    <input
                        type="text"
                        id="promoCode"
                        placeholder="Enter your promo code…"
                        autocomplete="off"
                        spellcheck="false"
                    >
                </div>
                <button class="validate-btn" id="validateBtn" onclick="validatePromo()">
                    Validate Code
                </button>
                <div class="promo-result" id="promoResult"></div>
            </div>

            <!-- Divider -->
            <div class="divider">
                <div class="divider-line"></div>
                <div class="divider-text">or pay with</div>
                <div class="divider-line"></div>
            </div>

            <!-- Payment Methods -->
            <div class="payment-section">
                <h3>Select Payment Method</h3>
                <div class="payment-methods">
                    <div class="payment-method" onclick="selectPayment('paypal')" id="method-paypal">
                        <div class="payment-icon paypal">P</div>
                        <div class="payment-info">
                            <div class="payment-name">PayPal</div>
                            <div class="payment-desc">Pay securely with your PayPal account</div>
                        </div>
                        <div class="payment-check"></div>
                    </div>

                    <div class="payment-method" onclick="selectPayment('google_pay')" id="method-google_pay">
                        <div class="payment-icon google-pay">G</div>
                        <div class="payment-info">
                            <div class="payment-name">Google Pay</div>
                            <div class="payment-desc">Pay quickly with Google Pay</div>
                        </div>
                        <div class="payment-check"></div>
                    </div>

                    <div class="payment-method" onclick="selectPayment('chime')" id="method-chime">
                        <div class="payment-icon chime">C</div>
                        <div class="payment-info">
                            <div class="payment-name">Chime</div>
                            <div class="payment-desc">Pay with your Chime bank account</div>
                        </div>
                        <div class="payment-check"></div>
                    </div>
                </div>
            </div>

            <!-- Continue Button -->
            <button class="continue-btn" id="continueBtn" onclick="continueToRegister()" disabled>
                Continue to Registration
            </button>

            <!-- Skip Link -->
            <div class="skip-link">
                <a href="register.html">Skip this step →</a>
            </div>
        </div>
    </div>

    <script>
        let promoValid = false;
        let selectedPayment = null;
        let paymentToken = null;

        // Validate promo code
        async function validatePromo() {
            const code = document.getElementById('promoCode').value.trim();
            const btn = document.getElementById('validateBtn');
            const result = document.getElementById('promoResult');

            if (!code) {
                showResult('Please enter a promo code', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Validating…';

            try {
                const response = await fetch('/api/v1/onboarding/promo/validate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code })
                });

                const data = await response.json();

                if (response.ok && data.valid) {
                    promoValid = true;
                    showResult('✓ ' + (data.message || 'Promo code is valid!') + (data.description ? ' — ' + data.description : ''), 'success');
                    updateContinueButton();
                } else {
                    promoValid = false;
                    showResult('✗ ' + (data.error || 'Invalid promo code'), 'error');
                    updateContinueButton();
                }
            } catch (err) {
                showResult('✗ Network error — try again', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Validate Code';
            }
        }

        // Select payment method
        function selectPayment(method) {
            // Clear previous selection
            document.querySelectorAll('.payment-method').forEach(el => {
                el.classList.remove('selected');
            });

            // Select new method
            const el = document.getElementById('method-' + method);
            el.classList.add('selected');
            selectedPayment = method;

            // Verify payment method with backend
            verifyPayment(method);
        }

        // Verify payment method
        async function verifyPayment(method) {
            try {
                const response = await fetch('/api/v1/onboarding/payment/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ method: method })
                });

                const data = await response.json();

                if (response.ok && data.verified) {
                    paymentToken = data.paymentToken;
                    updateContinueButton();
                }
            } catch (err) {
                console.error('Payment verification failed:', err);
            }
        }

        // Show result message
        function showResult(message, type) {
            const result = document.getElementById('promoResult');
            result.textContent = message;
            result.className = 'promo-result ' + type;
        }

        // Update continue button state
        function updateContinueButton() {
            const btn = document.getElementById('continueBtn');
            btn.disabled = !(promoValid || selectedPayment);
        }

        // Continue to registration
        function continueToRegister() {
            // Store promo/payment info for next step
            const state = {
                promoCode: promoValid ? document.getElementById('promoCode').value.trim() : null,
                paymentToken: paymentToken,
                paymentMethod: selectedPayment
            };
            sessionStorage.setItem('onboarding_state', JSON.stringify(state));

            // Navigate to registration
            window.location.href = 'register.html';
        }

        // Allow Enter key to validate promo
        document.getElementById('promoCode').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                validatePromo();
            }
        });

        // Restore state from session storage if navigating back
        (function() {
            try {
                const saved = sessionStorage.getItem('onboarding_state');
                if (saved) {
                    const state = JSON.parse(saved);
                    if (state.promoCode) {
                        document.getElementById('promoCode').value = state.promoCode;
                    }
                }
            } catch (e) {
                // ignore
            }
        })();
    </script>
</body>
</html>
