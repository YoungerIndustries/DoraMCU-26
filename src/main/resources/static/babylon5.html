<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babylon 5</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0a0e27; color: #e0e0e0; }

        .header {
            background: linear-gradient(135deg, #1a237e 0%, #0a0e27 100%);
            padding: 16px 24px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #3949ab;
        }
        .header h1 { font-size: 24px; color: #fff; }
        .header .subtitle { font-size: 12px; color: #a0a0a0; margin-top: 2px; }
        .btn-back {
            background: #3949ab; color: #fff; padding: 8px 16px;
            border-radius: 6px; text-decoration: none; font-size: 14px;
        }
        .btn-back:hover { background: #283593; }

        .layout { display: flex; height: calc(100vh - 70px); }
        .sidebar {
            width: 220px; background: #0d1132; padding: 16px;
            overflow-y: auto; border-right: 1px solid #1a237e;
        }
        .sidebar-section { margin-bottom: 20px; }
        .sidebar-title {
            font-size: 11px; text-transform: uppercase; color: #3949ab;
            margin-bottom: 8px; font-weight: 600; letter-spacing: 1px;
        }
        .sidebar-item {
            padding: 8px 12px; margin: 2px 0; border-radius: 6px;
            cursor: pointer; font-size: 14px; transition: all 0.2s;
        }
        .sidebar-item:hover { background: #1a237e; }
        .sidebar-item.active { background: #3949ab; color: #fff; }

        .main-content { flex: 1; padding: 24px; overflow-y: auto; }
        .card {
            background: #0d1132; border-radius: 8px; padding: 20px;
            margin-bottom: 16px; border: 1px solid #1a237e;
        }
        .card h3 { color: #3949ab; margin-bottom: 12px; font-size: 16px; }
        .grid { display: grid; gap: 16px; }
        .grid-2 { grid-template-columns: repeat(2, 1fr); }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }

        .btn {
            background: #3949ab; color: #fff; border: none;
            padding: 8px 16px; border-radius: 6px; cursor: pointer;
            font-size: 14px; margin: 4px;
        }
        .btn:hover { background: #283593; }

        .item-row {
            background: #0a0e27; border: 1px solid #1a237e;
            border-radius: 6px; padding: 12px; margin: 6px 0;
        }
        .item-row .name { font-weight: 600; color: #fff; }
        .item-row .detail { font-size: 12px; color: #a0a0a0; margin-top: 4px; }

        .loading { text-align: center; padding: 40px; color: #a0a0a0; }

        @media (max-width: 768px) {
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>🛸 Babylon 5</h1>
            <div class="subtitle">Races, Characters, Ships & Stations</div>
        </div>
        <a href="younger-hq.html" class="btn-back">← Back to HQ Portal</a>
    </div>

    <div class="layout">
        <div class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">Universe</div>
                <div class="sidebar-item active" onclick="switchView('dashboard')">📊 Dashboard</div>
                <div class="sidebar-item" onclick="switchView('races')">👽 Races</div>
                <div class="sidebar-item" onclick="switchView('characters')">👤 Characters</div>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-title">Fleet</div>
                <div class="sidebar-item" onclick="switchView('ships')">🚀 Ships</div>
                <div class="sidebar-item" onclick="switchView('stations')">🛰️ Stations</div>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-title">Campaign</div>
                <div class="sidebar-item" onclick="switchView('galaxy')">🌌 Galaxy</div>
            </div>
        </div>

        <div class="main-content" id="mainContent">
            <div class="loading">Loading Babylon 5 universe...</div>
        </div>
    </div>

    <script>
        const API = '/api/v1/babylon5';
        let currentView = 'dashboard';
        let races = [], characters = [], ships = [], stations = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadRaces();
            loadCharacters();
            loadShips();
            loadStations();
            switchView('dashboard');
        });

        function switchView(view) {
            currentView = view;
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            event?.target?.classList.add('active');
            const content = document.getElementById('mainContent');
            switch(view) {
                case 'dashboard': renderDashboard(content); break;
                case 'races': renderRaces(content); break;
                case 'characters': renderCharacters(content); break;
                case 'ships': renderShips(content); break;
                case 'stations': renderStations(content); break;
                case 'galaxy': renderGalaxy(content); break;
            }
        }

        async function renderDashboard(container) {
            container.innerHTML = `
                <h2 style="margin-bottom:20px;">🛸 Babylon 5 Dashboard</h2>
                <div class="grid grid-3">
                    <div class="card">
                        <h3>👽 Races</h3>
                        <div style="font-size:32px;font-weight:bold;color:#3949ab;">${races.length}</div>
                        <div style="font-size:12px;color:#a0a0a0;">Alien races</div>
                    </div>
                    <div class="card">
                        <h3>👤 Characters</h3>
                        <div style="font-size:32px;font-weight:bold;color:#3949ab;">${characters.length}</div>
                        <div style="font-size:12px;color:#a0a0a0;">Known characters</div>
                    </div>
                    <div class="card">
                        <h3>🚀 Ships</h3>
                        <div style="font-size:32px;font-weight:bold;color:#3949ab;">${ships.length}</div>
                        <div style="font-size:12px;color:#a0a0a0;">Starships</div>
                    </div>
                </div>
                <div class="card">
                    <h3>⚡ Quick Actions</h3>
                    <button class="btn" onclick="switchView('races')">Browse Races</button>
                    <button class="btn" onclick="switchView('characters')">View Characters</button>
                    <button class="btn" onclick="switchView('ships')">Fleet Overview</button>
                    <button class="btn" onclick="generateGalaxy()">Generate Galaxy</button>
                </div>
            `;
        }

        function renderRaces(container) {
            container.innerHTML = `
                <h2 style="margin-bottom:20px;">👽 Alien Races</h2>
                <div class="card">
                    ${races.map(r => `
                        <div class="item-row">
                            <div class="name">${r.name || r.raceId || 'Unknown'}</div>
                            <div class="detail">${r.description || 'No description available'}</div>
                        </div>
                    `).join('') || '<div style="color:#a0a0a0;">No races loaded</div>'}
                </div>
            `;
        }

        function renderCharacters(container) {
            container.innerHTML = `
                <h2 style="margin-bottom:20px;">👤 Characters</h2>
                <div class="card">
                    ${characters.map(c => `
                        <div class="item-row">
                            <div class="name">${c.name || 'Unknown'}</div>
                            <div class="detail">${c.species || ''} ${c.role ? '• ' + c.role : ''}</div>
                        </div>
                    `).join('') || '<div style="color:#a0a0a0;">No characters loaded</div>'}
                </div>
            `;
        }

        function renderShips(container) {
            container.innerHTML = `
                <h2 style="margin-bottom:20px;">🚀 Starships</h2>
                <div class="card">
                    ${ships.map(s => `
                        <div class="item-row">
                            <div class="name">${s.name || 'Unknown'}</div>
                            <div class="detail">${s.class || s.type || ''} ${s.faction ? '• ' + s.faction : ''}</div>
                        </div>
                    `).join('') || '<div style="color:#a0a0a0;">No ships loaded</div>'}
                </div>
            `;
        }

        function renderStations(container) {
            container.innerHTML = `
                <h2 style="margin-bottom:20px;">🛰️ Stations</h2>
                <div class="card">
                    ${stations.map(s => `
                        <div class="item-row">
                            <div class="name">${s.name || 'Unknown'}</div>
                            <div class="detail">${s.type || ''} ${s.location ? '• ' + s.location : ''}</div>
                        </div>
                    `).join('') || '<div style="color:#a0a0a0;">No stations loaded</div>'}
                </div>
            `;
        }

        function renderGalaxy(container) {
            container.innerHTML = `
                <h2 style="margin-bottom:20px;">🌌 Galaxy Generation</h2>
                <div class="card">
                    <h3>Babylon 5 Galaxy</h3>
                    <p style="color:#a0a0a0;margin-bottom:12px;">Generate a new galaxy using the Babylon 5 template with empires for each B5 race.</p>
                    <button class="btn" onclick="generateGalaxy()">Generate Galaxy</button>
                    <div id="galaxyResult" style="margin-top:12px;"></div>
                </div>
            `;
        }

        async function generateGalaxy() {
            const result = document.getElementById('galaxyResult');
            if (result) result.innerHTML = '<div class="loading">Generating galaxy...</div>';
            try {
                const response = await fetch(`${API}/galaxy/generate`, { method: 'POST' });
                const data = await response.json();
                if (result) {
                    result.innerHTML = `
                        <div class="item-row" style="border-color:#4caf50;">
                            <div class="name">✓ Galaxy Created</div>
                            <div class="detail">Name: ${data.galaxyName} | ID: ${data.galaxyId} | Empires: ${data.empireCount}</div>
                        </div>
                    `;
                }
            } catch (e) {
                if (result) result.innerHTML = `<div style="color:#e53e3e;">Failed: ${e.message}</div>`;
            }
        }

        async function loadRaces() {
            try { races = await fetch(`${API}/races`).then(r => r.json()); }
            catch (e) { console.error('Failed to load races:', e); }
        }

        async function loadCharacters() {
            try { characters = await fetch(`${API}/characters`).then(r => r.json()); }
            catch (e) { console.error('Failed to load characters:', e); }
        }

        async function loadShips() {
            try { ships = await fetch(`${API}/ships`).then(r => r.json()); }
            catch (e) { console.error('Failed to load ships:', e); }
        }

        async function loadStations() {
            try { stations = await fetch(`${API}/stations`).then(r => r.json()); }
            catch (e) { console.error('Failed to load stations:', e); }
        }
    </script>
</body>
</html>
