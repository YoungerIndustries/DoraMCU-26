# Brain Node Profile — PC Server registers with Pi Brain Stem
# This profile configures a PC server to register as a Brain Node with the Pi
# Usage: java -jar DoraMCU-0.6.0.jar --spring.profiles.active=brain-node

# Brain Node Configuration
doramcu.brain-node.enabled=true
doramcu.brain-node.brain-stem-url=http://192.168.1.111:8080
doramcu.brain-node.node-type=BrainCell
doramcu.brain-node.heartbeat-interval-seconds=60
doramcu.brain-node.registration-delay-ms=10000

# Node capabilities (auto-detected if not set)
# doramcu.brain-node.cpu-cores=16
# doramcu.brain-node.ram-mb=15360
# doramcu.brain-node.gpu-tier=none

# Network info (auto-detected if not set)
# doramcu.brain-node.ip-address=192.168.50.150
# doramcu.brain-node.port=8080

# Server configuration
server.port=8080

# Allow overriding references
spring.main.allow-bean-definition-overriding=true

# H2 File-Based Database — separate from production/test to avoid lock conflicts
spring.datasource.url=jdbc:h2:file:./data/doramcu-brain-node
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway enabled with baseline mode - Hibernate manages existing schema,
# Flyway manages future migrations only. Baseline treats current schema as V999.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=999
spring.flyway.baseline-description=Baseline from Hibernate-managed H2 schema

# Logging — mark brain node logs for easy identification
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [BRAIN-NODE] [%thread] [%X{correlationId:-}] %-5level %logger{36} - %msg%n
logging.file.name=logs/doramcu-brain-node.log

# Disable DL4J rest client (no separate DL server on PC nodes)
dl.rest-client.enabled=false

# JWT Configuration — default provided in JwtService.java
# Override by setting JWT_SECRET environment variable

# Game State Snapshots — periodic save of active sessions
doramcu.snapshot.enabled=true
doramcu.snapshot.interval=300000
