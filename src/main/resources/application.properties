spring.application.name=DoraMCU
server.port=8080
server.address=0.0.0.0

# Server Encoding - Force UTF-8 charset on all responses
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true
spring.servlet.encoding.force-response=true

# Active Profile - Use 'dev' for H2 in-memory DB, 'mysql' for MySQL
spring.profiles.active=dev

# Database Configuration - See application-dev.properties and application-mysql.properties for profile-specific settings

# JPA Configuration - Flyway manages schema in production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# Game Session Configuration
gamesession.ttl-hours=24

# Logging Configuration
logging.level.root=INFO
logging.level.com.yisy.modules.doramcu=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate=INFO
logging.level.org.flywaydb=INFO

# Logging Pattern - Console
logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss.SSS
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId:-}] %-5level %logger{36} - %msg%n

# Logging File Output
logging.file.name=logs/doramcu.log
logging.file.max-size=10MB
logging.file.max-history=5

# Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=600s

# Rate Limiting Configuration
ratelimit.general.requests-per-minute=500
ratelimit.login.requests-per-minute=30
ratelimit.window-seconds=60

# Actuator Monitoring Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers,env,beans,mappings,threaddump
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.info.enabled=true
management.endpoint.shutdown.enabled=false
management.info.env.enabled=true
management.metrics.tags.application=DoraMCU

# Custom Info Properties
info.app.name=DoraMCU
info.app.description=DoraMCU Device Management System
info.app.version=${APP_VERSION:0.4.0}
info.app.java.version=27

# Deep Learning AI Configuration
dl.input-size=32
dl.hidden-layer1-size=64
dl.hidden-layer2-size=128
dl.hidden-layer3-size=64
dl.output-size=5
dl.learning-rate=0.001
dl.batch-size=32
dl.epochs=10
dl.seed=42
dl.blend-factor=0.5
dl.model-dir=dl-models

# DL Memory Guard Configuration (prevents OOM crashes)
# When enabled, checks available memory before DL training operations
dl.memory-guard.enabled=true
dl.memory-guard.min-free-memory-mb=512
dl.memory-guard.max-physical-memory-mb=4096

# AI Difficulty Configuration
ai.difficulty.easy.build-minerals=150
ai.difficulty.easy.build-energy=80
ai.difficulty.medium.build-minerals=100
ai.difficulty.medium.build-energy=50
ai.difficulty.medium.cruiser-minerals=200
ai.difficulty.medium.cruiser-energy=100
ai.difficulty.medium.destroyer-minerals=100
ai.difficulty.medium.destroyer-energy=50
ai.difficulty.hard.build-minerals=80
ai.difficulty.hard.build-energy=40
ai.difficulty.hard.max-ships-per-turn=3
ai.difficulty.hard.battleship-minerals=300
ai.difficulty.hard.battleship-energy=150
ai.difficulty.hard.cruiser-minerals=200
ai.difficulty.hard.cruiser-energy=100
ai.difficulty.hard.destroyer-minerals=100
ai.difficulty.hard.destroyer-energy=50

# Turn Scheduler Configuration
doramcu.turn.interval.seconds=5

# Corporation Management Configuration
doramcu.corporation.management.enabled=true

# Database Connection Pool Configuration (HikariCP)
# Increased from 10 to 30 to handle concurrent galaxy operations with parallel turn processing
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Async Thread Pool Configuration
# Corporation AI management cycles (default executor)
doramcu.async.core-pool-size=5
doramcu.async.max-pool-size=20
doramcu.async.queue-capacity=100
# Galaxy Overlord AI processing (per-galaxy isolation)
doramcu.async.ai-core-pool-size=3
doramcu.async.ai-max-pool-size=15
# Galaxy health check assessments (async scheduled tasks)
doramcu.async.health-check-core-pool-size=2
doramcu.async.health-check-max-pool-size=10
# Galaxy event publishing and SSE broadcasting
doramcu.async.event-core-pool-size=2
doramcu.async.event-max-pool-size=10
# Turn scheduler parallel processing
doramcu.turn.parallel.max-threads=10

# Galaxy Processor Configuration (per-galaxy bounded contexts)
doramcu.galaxy.processor.max-galaxies=10
doramcu.galaxy.processor.threads-per-galaxy=2
doramcu.galaxy.processor.event-queue-size=500

# Redis Event Service Configuration (disabled by default, enable for multi-process mode)
doramcu.event.redis.enabled=false
doramcu.event.redis.history-ttl=3600
# Redis connection settings (used when doramcu.event.redis.enabled=true)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=5000

# Galaxy Process Manager Configuration (disabled by default, enable for multi-process mode)
doramcu.process.manager.enabled=false
doramcu.process.manager.mode=local
doramcu.process.manager.max-processes=10
doramcu.process.manager.restart-on-failure=true
doramcu.process.manager.health-check-interval-ms=30000

# Game Client Configuration
game.client.executable-path=unity-client/Build/DoraMCU.Client.exe
neuron.coordinator.cdc.enabled=true
neuron.coordinator.snapshot.enabled=true

# AI Admin Test Configuration
dora.admin.test.base-url=http://localhost:8080

# Ollama Configuration
ollama.base-url=http://localhost:11434
ollama.model=qwen2.5:14b
ollama.whisper-model=whisper
ollama.temperature=0.7
ollama.max-tokens=2048
ollama.connect-timeout-ms=5000
ollama.read-timeout-ms=120000

# Google Gemini Configuration (disabled - Free Tier quota exhausted)
gemini.enabled=false
gemini.api-key=${GEMINI_API_KEY:}
gemini.base-url=https://generativelanguage.googleapis.com
gemini.model=gemini-3.8-flash
gemini.temperature=0.7
gemini.max-tokens=2048
gemini.connect-timeout-ms=5000
gemini.read-timeout-ms=120000

# DeepSeek Configuration (disabled by default)
deepseek.enabled=true
deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.base-url=https://api.deepseek.com
deepseek.model=deepseek-chat
deepseek.temperature=0.7
deepseek.max-tokens=2048
deepseek.connect-timeout-ms=5000
deepseek.read-timeout-ms=120000

# OpenHands / DoraAI2 Configuration (autonomous coding agent)
openhands.enabled=true
openhands.base-url=http://localhost:8082
openhands.mode=chat
openhands.connect-timeout-ms=5000
openhands.read-timeout-ms=300000

# AI Provider Configuration
ai.provider.default=ollama

# GameLauncher Configuration
# Set to "desktop" to auto-launch Electron after server startup, "server" (default) for headless mode
doramcu.launcher.mode=server
doramcu.launcher.electron-dir=dora-electron
doramcu.launcher.server-url=http://localhost:8080
doramcu.launcher.timeout-seconds=120

# Web UI Configuration
# Set to "true" to disable static resource serving (API-only mode) for external web UI hosting
doramcu.web-ui.external=false
