spring.application.name=DoraMCU
server.port=8080
server.address=0.0.0.0

# Active Profile - Use 'dev' for H2 in-memory DB, 'mysql' for MySQL
spring.profiles.active=dev

# MySQL Configuration (use profile 'mysql' to activate)
spring.datasource.url=jdbc:mysql://localhost:3306/doramcu
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

# JPA Configuration - Flyway manages schema in production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

# Game Session Configuration
gamesession.ttl-hours=24

# Logging Configuration
logging.level.root=INFO
logging.level.com.yisy.modules.doramcu=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate=INFO
logging.level.org.flywaydb=INFO

# Logging Pattern - Console
logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss.SSS
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId:-}] %-5level %logger{36} - %msg%n

# Logging File Output
logging.file.name=logs/doramcu.log
logging.file.max-size=10MB
logging.file.max-history=5

# Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=600s

# Rate Limiting Configuration
ratelimit.general.requests-per-minute=100
ratelimit.login.requests-per-minute=5
ratelimit.window-seconds=60

# Actuator Monitoring Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers,env,beans,mappings,threaddump
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.info.enabled=true
management.info.env.enabled=true
management.metrics.tags.application=DoraMCU

# Custom Info Properties
info.app.name=DoraMCU
info.app.description=DoraMCU Device Management System
info.app.version=0.0.1-SNAPSHOT
info.app.java.version=27

# Deep Learning AI Configuration
dl.input-size=32
dl.hidden-layer1-size=64
dl.hidden-layer2-size=128
dl.hidden-layer3-size=64
dl.output-size=5
dl.learning-rate=0.001
dl.batch-size=32
dl.epochs=10
dl.seed=42
dl.blend-factor=0.5
dl.model-dir=dl-models

# AI Difficulty Configuration
ai.difficulty.easy.build-minerals=150
ai.difficulty.easy.build-energy=80
ai.difficulty.medium.build-minerals=100
ai.difficulty.medium.build-energy=50
ai.difficulty.medium.cruiser-minerals=200
ai.difficulty.medium.cruiser-energy=100
ai.difficulty.medium.destroyer-minerals=100
ai.difficulty.medium.destroyer-energy=50
ai.difficulty.hard.build-minerals=80
ai.difficulty.hard.build-energy=40
ai.difficulty.hard.max-ships-per-turn=3
ai.difficulty.hard.battleship-minerals=300
ai.difficulty.hard.battleship-energy=150
ai.difficulty.hard.cruiser-minerals=200
ai.difficulty.hard.cruiser-energy=100
ai.difficulty.hard.destroyer-minerals=100
ai.difficulty.hard.destroyer-energy=50

# Turn Scheduler Configuration
doramcu.turn.interval.seconds=5

# Game Client Configuration
game.client.executable-path=unity-client/Build/DoraMCU.Client.exe
neuron.coordinator.cdc.enabled=true
neuron.coordinator.snapshot.enabled=true

# AI Admin Test Configuration
dora.admin.test.base-url=http://localhost:8080
