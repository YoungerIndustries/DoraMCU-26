# Test Profile - H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable Flyway for tests
spring.flyway.enabled=false

# Disable heavy auto-generation during unit/integration tests
doramcu.galaxy.auto-generate=false

# Ollama AI Configuration (disabled for tests)
ollama.enabled=false

# Allow bean definition overriding for test profile (TestConfig overrides WebConfig objectMapper)
spring.main.allow-bean-definition-overriding=true
