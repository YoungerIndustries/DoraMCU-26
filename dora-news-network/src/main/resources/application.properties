# Dora News Network Configuration
server.port=8084
server.address=0.0.0.0

# Main DoraMCU server URL (for proxying news API calls)
doramcu.server.url=http://localhost:8080

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Disable static resource caching to prevent stale page issues
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# Logging
logging.level.com.yisy.modules.doranews=INFO
logging.level.root=INFO
