app.jvm.args=-Xmx4G -XX:+UseG1GC -XX:MaxGCPauseMillis=200
app.javacpp.args=-Dorg.bytedeco.javacpp.maxbytes=2G -Dorg.bytedeco.javacpp.maxphysicalbytes=2G -Dorg.bytedeco.javacpp.alloctype=direct
