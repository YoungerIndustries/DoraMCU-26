# Raspberry Pi overlay for DoraMCU Docker Compose
# Usage: docker compose -f docker-compose.yml -f docker-compose.pi.yml up -d
#
# This overlay reduces resource limits for ARM64 Raspberry Pi (4GB+ RAM recommended, 8GB ideal)
# and enables edge-specific optimizations for the neuron gateway.

services:
  # Nginx — minimal memory footprint
  nginx:
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # Neuron — edge profile with reduced JVM heap
  neuron:
    environment:
      - NEURON_COORDINATOR_URL=http://app:8080
      - NEURON_GAME_SERVER_URL=http://app:8080
      - NEURON_SECURITY_JWT_SECRET=${NEURON_SECURITY_JWT_SECRET:-}
      - JVM_XMX=-Xmx256m
      - NEURON_EDGE_FORCED_PROFILE=EDGE
      - NEURON_EDGE_INFERENCE_THREADS=1
      - NEURON_EDGE_BUFFER_SIZE=128
      - NEURON_EDGE_FLUSH_INTERVAL_MS=3000
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # App — reduced heap, DL offloaded to Python service
  app:
    environment:
      - SPRING_PROFILES_ACTIVE=docker,production
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - JWT_SECRET=${JWT_SECRET:-}
      - DL_MODE=rest
      - DEBUG=${DEBUG:-}
      - JVM_XMX=-Xmx1G
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.5'
        reservations:
          memory: 512M
          cpus: '0.5'

  # MySQL — reduced InnoDB buffer pool for Pi memory constraints
  mysql:
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=256M
      --innodb-log-file-size=64M
      --max-connections=50
      --thread-cache-size=8
      --key-buffer-size=16M
      --sort-buffer-size=256K
      --read-buffer-size=256K
      --read-rnd-buffer-size=512K
      --tmp-table-size=16M
      --max-heap-table-size=16M
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # DL — ARM64 CPU-only PyTorch, no GPU acceleration
  dl:
    build:
      context: .
      dockerfile: Dockerfile.dl.arm64
    environment:
      - DORA_DL_PORT=8083
      - DL_MODEL_DIR=/app/dl-models
      - DL_BLEND_FACTOR=0.5
      - DL_CPU_ONLY=true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Redis — minimal memory profile
  redis:
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
