name: DoraMCU CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 27
        uses: actions/setup-java@v4
        with:
          java-version: '27'
          distribution: 'temurin'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: ./gradlew :bootJar dora-neuron:build --no-daemon --parallel
        env:
          JAVA_OPTS: "-Xmx4g"

      - name: Run tests
        run: ./gradlew test dora-neuron:test --no-daemon --parallel
        env:
          JAVA_OPTS: "-Xmx4g"

      - name: Generate JaCoCo coverage report
        run: ./gradlew jacocoTestReport --no-daemon
        env:
          JAVA_OPTS: "-Xmx4g"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/build/test-results/test/
            **/build/reports/tests/

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage
          path: build/reports/jacoco/test/html/

      - name: Upload JaCoCo XML for badge
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-xml
          path: build/reports/jacoco/test/jacocoTestReport.xml

      - name: OWASP Dependency-Check
        run: ./gradlew dependencyCheckAnalyze --no-daemon
        continue-on-error: true
        env:
          JAVA_OPTS: "-Xmx4g"

      - name: Upload Dependency-Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report-*.html

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dora-mcu-jar
          path: build/libs/*.jar

      # Code Quality Check
      - name: Check for compilation warnings
        run: ./gradlew compileJava --no-daemon -warning-mode all 2>&1 | tee compile-log.txt || true

      # Docker Build and Push
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for main app
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push main Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push neuron Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.neuron
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-neuron:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-neuron:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ARM64 builds for Raspberry Pi deployment
      - name: Build and push neuron-edge ARM64 image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.neuron
          push: true
          platforms: linux/arm64/v8
          build-args: |
            BASE_IMAGE=eclipse-temurin:27-jre-alpine
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-neuron-edge:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-neuron-edge:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push main app ARM64 image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/arm64/v8
          target: prod
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-arm64:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-arm64:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Security scanning with Trivy
      - name: Run Trivy vulnerability scanner
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy scan results to GitHub Security tab
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DEV }}" | base64 -d > $HOME/.kube/config
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_DEV }}

      - name: Deploy to Kubernetes (dev)
        run: |
          kubectl apply -k k8s/overlays/dev/ -n doramcu-dev
          kubectl set image deployment/doramcu-app doramcu=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} -n doramcu-dev
          kubectl rollout status deployment/doramcu-app -n doramcu-dev --timeout=300s

      - name: Verify deployment health
        run: |
          kubectl get pods -n doramcu-dev
          kubectl get services -n doramcu-dev

  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > $HOME/.kube/config
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_PROD }}

      - name: Deploy to Kubernetes (prod)
        run: |
          kubectl apply -k k8s/overlays/production/ -n doramcu-prod
          kubectl set image deployment/doramcu-app doramcu=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} -n doramcu-prod
          kubectl rollout status deployment/doramcu-app -n doramcu-prod --timeout=300s

      - name: Verify deployment health
        run: |
          kubectl get pods -n doramcu-prod
          kubectl get services -n doramcu-prod
