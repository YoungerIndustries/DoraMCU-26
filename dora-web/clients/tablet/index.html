<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <title>DoraMCU Tablet</title>
    <style>
        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #131842;
            --bg-card: #1a1f4e;
            --bg-card-hover: #252b6e;
            --text-primary: #e0e6ff;
            --text-secondary: #8892b0;
            --accent-primary: #64ffda;
            --accent-secondary: #7c4dff;
            --border-color: #2a3070;
            --sidebar-width: 200px;
            --header-height: 60px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 100;
        }

        .header-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent-primary);
        }

        .header-status {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-primary);
        }

        .status-dot.disconnected {
            background: #ff5252;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: var(--header-height);
            left: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            padding: 12px 0;
            overflow-y: auto;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            cursor: pointer;
            transition: background 0.2s;
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .nav-item:hover, .nav-item.active {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .nav-item.active {
            border-left: 3px solid var(--accent-primary);
        }

        .nav-icon {
            margin-right: 12px;
            font-size: 1.3rem;
        }

        /* Main content */
        .main-content {
            margin-left: var(--sidebar-width);
            margin-top: var(--header-height);
            padding: 20px;
            min-height: calc(100vh - var(--header-height));
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--accent-primary);
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-primary);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Dashboard grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        /* Session list */
        .session-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .session-item:last-child {
            border-bottom: none;
        }

        .session-name {
            font-weight: 500;
            font-size: 1rem;
        }

        .session-status {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Buttons */
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: var(--bg-primary);
        }

        .btn-primary:hover {
            background: #4de8c0;
        }

        .btn-secondary {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }

        .btn-block {
            display: block;
            width: 100%;
            margin-top: 8px;
        }

        /* Sections */
        .section { display: none; }
        .section.active { display: block; }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        /* Event feed */
        .event-feed {
            max-height: 400px;
            overflow-y: auto;
        }

        .event-item {
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .event-time {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Corporation iframe */
        .corporation-iframe {
            width: 100%;
            height: 500px;
            border: none;
            border-radius: 8px;
        }

        /* Settings */
        .settings-input {
            width: 100%;
            padding: 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <h1 class="header-title">DoraMCU</h1>
        <div class="header-status">
            <div class="status-dot" id="statusDot"></div>
            <span id="connectionStatus">Connecting...</span>
        </div>
    </header>

    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="nav-item active" data-section="dashboard">
            <span class="nav-icon">🏠</span> Dashboard
        </div>
        <div class="nav-item" data-section="sessions">
            <span class="nav-icon">🎮</span> Sessions
        </div>
        <div class="nav-item" data-section="characters">
            <span class="nav-icon">👤</span> Characters
        </div>
        <div class="nav-item" data-section="corporation">
            <span class="nav-icon">🏢</span> Corporation
        </div>
        <div class="nav-item" data-section="settings">
            <span class="nav-icon">⚙️</span> Settings
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Dashboard -->
        <section id="dashboard" class="section active">
            <h2 style="margin-bottom: 20px;">Dashboard</h2>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-value" id="statPlayers">0</div>
                    <div class="stat-label">Players</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="statSessions">0</div>
                    <div class="stat-label">Sessions</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="statCharacters">0</div>
                    <div class="stat-label">Characters</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="statCorporations">0</div>
                    <div class="stat-label">Corporations</div>
                </div>
            </div>

            <div class="dashboard-grid">
                <div class="card">
                    <h3 class="card-title">Recent Activity</h3>
                    <div class="event-feed" id="eventFeed">
                        <div class="loading">Loading events...</div>
                    </div>
                </div>
                <div class="card">
                    <h3 class="card-title">Quick Actions</h3>
                    <button class="btn btn-primary btn-block" onclick="createSession()">New Session</button>
                    <button class="btn btn-secondary btn-block" onclick="navigateTo('characters')">Create Character</button>
                    <button class="btn btn-secondary btn-block" onclick="navigateTo('corporation')">Corporation</button>
                </div>
            </div>
        </section>

        <!-- Sessions -->
        <section id="sessions" class="section">
            <h2 style="margin-bottom: 20px;">Game Sessions</h2>
            <div class="card">
                <button class="btn btn-primary" style="margin-bottom: 16px;" onclick="createSession()">Create Session</button>
                <div id="sessionList">
                    <div class="loading">Loading sessions...</div>
                </div>
            </div>
        </section>

        <!-- Characters -->
        <section id="characters" class="section">
            <h2 style="margin-bottom: 20px;">Characters</h2>
            <div class="card">
                <button class="btn btn-primary" style="margin-bottom: 16px;" onclick="createCharacter()">New Character</button>
                <div id="characterList">
                    <div class="loading">Loading characters...</div>
                </div>
            </div>
        </section>

        <!-- Corporation -->
        <section id="corporation" class="section">
            <h2 style="margin-bottom: 20px;">Corporation</h2>
            <div class="card">
                <iframe class="corporation-iframe" id="corporationIframe" src="" title="Corporation"></iframe>
            </div>
        </section>

        <!-- Settings -->
        <section id="settings" class="section">
            <h2 style="margin-bottom: 20px;">Settings</h2>
            <div class="card">
                <label style="display: block; margin-bottom: 8px;">Server URL</label>
                <input type="url" class="settings-input" id="serverUrl" placeholder="http://localhost:8080">
                <button class="btn btn-primary" onclick="saveSettings()">Save</button>
            </div>
        </section>
    </main>

    <script src="../../js/api-client.js"></script>
    <script>
        let apiUrl = 'http://localhost:8080';
        let api = new ApiClient(apiUrl);

        // Listen for config from parent
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'CONFIG') {
                apiUrl = event.data.apiUrl || apiUrl;
                api = new ApiClient(apiUrl);
                initialize();
            }
        });

        // Navigation
        function navigateTo(section) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(section).classList.add('active');
            document.querySelector(`[data-section="${section}"]`).classList.add('active');
        }

        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => navigateTo(item.dataset.section));
        });

        // Initialize
        async function initialize() {
            try {
                await api.healthCheck();
                document.getElementById('connectionStatus').textContent = 'Connected';
                document.getElementById('statusDot').classList.remove('disconnected');
                
                loadStats();
                loadSessions();
                connectEvents();
                
                // Set corporation iframe
                document.getElementById('corporationIframe').src = `${apiUrl}/corporation/`;
            } catch (error) {
                console.error('Connection failed:', error);
                document.getElementById('connectionStatus').textContent = 'Disconnected';
                document.getElementById('statusDot').classList.add('disconnected');
            }
        }

        // Load stats
        async function loadStats() {
            try {
                const sessions = await api.getGameSessions();
                document.getElementById('statSessions').textContent = sessions.length || 0;
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        // Load sessions
        async function loadSessions() {
            try {
                const sessions = await api.getGameSessions();
                const list = document.getElementById('sessionList');
                
                if (sessions.length === 0) {
                    list.innerHTML = '<div class="loading">No active sessions</div>';
                    return;
                }

                list.innerHTML = sessions.map(s => `
                    <div class="session-item" onclick="joinSession('${s.id}')">
                        <div>
                            <div class="session-name">${s.name || 'Session'}</div>
                            <div class="session-status">${s.status || 'Active'}</div>
                        </div>
                        <span style="color: var(--accent-primary); font-size: 1.2rem;">Join →</span>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load sessions:', error);
            }
        }

        // Join session
        function joinSession(id) {
            alert(`Joining session: ${id}`);
        }

        // Create session
        async function createSession() {
            try {
                await api.createGameSession({ name: 'Tablet Session' });
                loadStats();
                loadSessions();
                alert('Session created!');
            } catch (error) {
                alert('Failed to create session');
            }
        }

        // Create character
        function createCharacter() {
            alert('Character creation would open here');
        }

        // Connect to events
        function connectEvents() {
            const eventSource = api.createEventSource();
            const feed = document.getElementById('eventFeed');
            
            eventSource.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    const item = document.createElement('div');
                    item.className = 'event-item';
                    item.innerHTML = `
                        <div>${data.message || 'New event'}</div>
                        <div class="event-time">${new Date().toLocaleTimeString()}</div>
                    `;
                    feed.prepend(item);
                    if (feed.children.length > 50) feed.removeChild(feed.lastChild);
                } catch (e) {
                    // Ignore parse errors
                }
            };
        }

        // Save settings
        function saveSettings() {
            const url = document.getElementById('serverUrl').value;
            if (url) {
                localStorage.setItem('doramcu_api_url', url);
                apiUrl = url;
                api = new ApiClient(url);
                initialize();
                alert('Settings saved!');
            }
        }

        // Load saved settings
        const savedUrl = localStorage.getItem('doramcu_api_url');
        if (savedUrl) {
            apiUrl = savedUrl;
            api = new ApiClient(apiUrl);
            document.getElementById('serverUrl').value = savedUrl;
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', initialize);
    </script>
</body>
</html>
