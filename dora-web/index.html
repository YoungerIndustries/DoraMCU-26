<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DoraMCU - Multi-Platform Game Client">
    <meta name="theme-color" content="#1a1a2e">
    <title>DoraMCU - Universal Game Client</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="manifest" href="manifest.json">
    <noscript>
        <style>
            .noscript-notice {
                display: block !important;
                padding: 2rem;
                text-align: center;
                background: #2a2a4a;
                color: #e0e0e0;
                margin: 2rem;
                border-radius: 8px;
            }
            .loading-container { display: none !important; }
        </style>
        <div class="noscript-notice">
            <h2>JavaScript Required</h2>
            <p>DoraMCU requires JavaScript to detect your platform and load the appropriate game client.</p>
            <p>Please enable JavaScript in your browser settings and reload this page.</p>
        </div>
    </noscript>
</head>
<body>
    <div class="loading-container">
        <div class="loading-spinner"></div>
        <h1 class="loading-title">DoraMCU</h1>
        <p class="loading-subtitle">Detecting your platform...</p>
        <p class="loading-status" id="status">Initializing...</p>
    </div>

    <div id="client-container" style="display: none;"></div>

    <script src="js/config.js"></script>
    <script src="js/platform-detect.js"></script>
    <script src="js/client-loader.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const statusEl = document.getElementById('status');
            
            try {
                // Step 1: Load server configuration
                statusEl.textContent = 'Loading configuration...';
                const config = await ConfigManager.loadConfig();
                
                // Step 2: Detect platform
                statusEl.textContent = 'Detecting your platform...';
                const platform = PlatformDetector.detect();
                
                // Step 3: Select and load appropriate client
                statusEl.textContent = `Loading ${platform.tier} client...`;
                await ClientLoader.loadClient(platform, config);
                
            } catch (error) {
                console.error('Failed to initialize client:', error);
                statusEl.textContent = 'Error loading client. Please try again.';
                statusEl.style.color = '#ff6b6b';
            }
        });
    </script>
</body>
</html>
