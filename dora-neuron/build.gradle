plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.YISY.modules'
version = findProperty('dora-neuron.version') ?: findProperty('app.version')
description = 'DoraMCU Neuron — Satellite AI node and web gateway'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(findProperty('java.version').toString().toInteger())
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // JWT for authentication
    implementation "io.jsonwebtoken:jjwt-api:${findProperty('jjwt.version')}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${findProperty('jjwt.version')}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${findProperty('jjwt.version')}"

    // ONNX Runtime for Java — lightweight inference without full DL4J
    implementation "com.microsoft.onnxruntime:onnxruntime:${findProperty('onnxruntime.version')}"

    // USB serial communication for Raspberry Pi control
    implementation 'com.fazecast:jSerialComm:2.11.0'

    // H2 database for Brain Node persistent storage
    runtimeOnly 'com.h2database:h2'

    // JPA for Brain Node entities
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
