# =============================================================================
# DoraMCU Brain Node Configuration
# Desktop-specific profile for enhanced AI inference, persistent storage,
# and USB serial communication with Raspberry Pi.
# =============================================================================

# ── Spring Boot ──────────────────────────────────────────────────────────────
spring.application.name=DoraMCU-BrainNode
server.port=8091
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration

# ── Neuron Standalone Mode ───────────────────────────────────────────────────
neuron.standalone=true

# ── Neuron Identity ──────────────────────────────────────────────────────────
neuron.node-type=BRAIN_NODE
neuron.node-name=Desktop-Brain-Node

# ── Coordinator Connection (Raspberry Pi as Primary) ─────────────────────────
neuron.coordinator-url=http://192.168.50.147:8080
neuron.coordinator-fallback-urls=
neuron.failover-enabled=true

# ── Brain Node Specific Settings ─────────────────────────────────────────────
brainnode.enabled=true
brainnode.node-type=BRAIN_NODE

# ── Raspberry Pi Connection ──────────────────────────────────────────────────
brainnode.pi-coordinator-url=http://192.168.50.147:8080
brainnode.serial-enabled=true
brainnode.serial-port-auto-detect=true
brainnode.serial-baud-rate=115200
brainnode.serial-heartbeat-interval=10000

# ── AI Inference (Enhanced for Desktop) ──────────────────────────────────────
neuron.inference-enabled=true
neuron.inference-threads=8
neuron.onnx-model-path=models/brain-node/
neuron.ai-model-path=models/brain-node/
neuron.edge.auto-optimize=false
brainnode.inference-threads=8
brainnode.ai-model-size=large
brainnode.ai-model-path=models/brain-node/
brainnode.confidence-threshold=0.85
brainnode.gpu-acceleration-enabled=false

# ── Experience Collection (Larger Buffers) ───────────────────────────────────
neuron.experience-buffer-size=5000
neuron.experience-enabled=true
brainnode.experience-buffer-size=5000

# ── Data Sync (Larger Queue) ─────────────────────────────────────────────────
neuron.data-sync-enabled=true
neuron.data-queue-max-size=10000
brainnode.data-queue-max-size=10000

# ── Persistent Local Storage ─────────────────────────────────────────────────
brainnode.storage-type=H2
brainnode.storage-path=backups/brain-node/
brainnode.ai-model-cache-enabled=true

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./backups/brain-node/brain-node-db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Resource Limits ──────────────────────────────────────────────────────────
brainnode.max-cpu-usage-percent=70
brainnode.max-memory-mb=4096

# ── Failover Settings ────────────────────────────────────────────────────────
brainnode.pi-health-check-timeout=30000
brainnode.pi-health-check-interval=10000
brainnode.auto-failover-enabled=true
neuron.auto-co-server-enabled=true

# ── P2P Mesh Networking ──────────────────────────────────────────────────────
neuron.mesh-enabled=true
neuron.mesh-peer-discovery-enabled=true
neuron.mesh-port=9090

# ── Leader Election ──────────────────────────────────────────────────────────
neuron.leader-election-enabled=true
neuron.leader-election-timeout=30000
neuron.leader-election-check-interval=10000

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.yisy.modules.doraneuron=INFO
logging.level.com.yisy.modules.doraneuron.service.brainnode=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# ── Security ─────────────────────────────────────────────────────────────────
neuron.security.jwt-secret=brainnode-secret-key-change-in-production-min-32-chars
neuron.security.jwt-expiration=3600000
