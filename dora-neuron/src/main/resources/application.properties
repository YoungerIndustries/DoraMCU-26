spring.application.name=DoraMCU-Neuron
server.port=8090
server.address=0.0.0.0

# ── Neuron Identity ──────────────────────────────────────────────────────────
# Unique node ID (auto-generated UUID if not set)
#neuron.node-id=
# Human-readable name
neuron.node-name=Neuron-Alpha
# Geographic region tag
neuron.node-region=default

# ── Coordinator Connection ───────────────────────────────────────────────────
# Base URL of the DoraMCU game server that hosts the Neuron Coordinator
neuron.coordinator-url=http://localhost:8084
# Heartbeat interval in milliseconds
neuron.heartbeat-interval-ms=15000
# Heartbeat timeout in milliseconds
neuron.heartbeat-timeout-ms=5000

# ── Satellite AI (Phase 2+) ──────────────────────────────────────────────────
#neuron.onnx-model-path=
neuron.inference-threads=2
neuron.confidence-threshold=0.6

# ── Experience Collection (Phase 3+) ─────────────────────────────────────────
neuron.experience-buffer-size=500
neuron.experience-flush-interval-ms=30000

# ── Web Portal ───────────────────────────────────────────────────────────────
# Target game server URL for redirect or proxy
neuron.game-server-url=http://localhost:8084
# Enable transparent reverse proxy mode (Phase 2+)
neuron.enable-game-proxy=false
# Landing page title
neuron.portal-title=DoraMCU Gateway

# ── Consensus Participation (Phase 4+) ───────────────────────────────────────
neuron.enable-consensus=true
neuron.consensus-timeout-ms=5000
neuron.vote-weight=1.0

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.yisy.modules.doraneuron=DEBUG

# ── Monitoring (Phase 5+) ────────────────────────────────────────────────────
# Monitoring endpoints: /api/v1/neuron/monitoring, /api/v1/neuron/monitoring/ping
# /api/v1/neuron/monitoring/inference

# ── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=DoraMCU-Neuron
info.app.name=DoraMCU-Neuron
info.app.version=0.1.0

# ── Security (Phase 8+) ──────────────────────────────────────────────────────
# JWT Authentication
neuron.security.jwt-enabled=true
neuron.security.jwt-secret=CHANGE-THIS-TO-A-SECURE-RANDOM-KEY-IN-PRODUCTION
neuron.security.jwt-issuer=DoraMCU-Neuron
neuron.security.jwt-audience=DoraMCU-Coordinator
neuron.security.token-expiration-ms=3600000
neuron.security.refresh-token-expiration-ms=86400000

# Rate Limiting
neuron.security.rate-limiting-enabled=true
neuron.security.max-requests-per-window=100
neuron.security.rate-limit-window-seconds=60

# Model Signature Verification
neuron.security.model-signature-enabled=true
#neuron.security.model-public-key-path=

# Mutual TLS (disabled by default)
neuron.security.mtls-enabled=false

# ── P2P Mesh Network (Phase 9+) ───────────────────────────────────────────────
# Enable direct neuron-to-neuron P2P mesh communication
neuron.mesh-enabled=true
# Maximum number of direct peer connections per neuron
neuron.mesh-max-peers=5
# Interval for peer discovery and topology updates (milliseconds)
neuron.mesh-peer-discovery-interval-ms=30000
# Timeout for peer health checks (milliseconds)
neuron.mesh-peer-timeout-ms=10000
# Enable decentralized consensus via P2P mesh
neuron.mesh-consensus-enabled=true
# Enable experience sharing via P2P mesh
neuron.mesh-experience-sync-enabled=true
# Maximum hop count for mesh message propagation
neuron.mesh-max-hops=3
# Port offset for P2P communication (base port + offset)
neuron.mesh-port-offset=100

# ── Edge Deployment (Phase 13+) ────────────────────────────────────────────────
# Enable automatic edge optimization based on detected hardware
neuron.edge.auto-optimize=true
# Force a specific system profile (overrides auto-detection): EDGE, MID_RANGE, SERVER
#neuron.edge.forced-profile=
# Enable model quantization for edge devices (INT8)
neuron.edge.quantization-enabled=true
# Path to store quantized models
neuron.edge.quantized-model-dir=/tmp/neuron-quantized-models
# Enable thermal throttling detection (Linux-only)
neuron.edge.thermal-detection-enabled=true
# CPU temperature threshold for throttling (Celsius)
neuron.edge.thermal-throttle-threshold=80.0
# Reduce inference frequency when thermally throttled
neuron.edge.reduce-inference-on-throttle=true
# Enable swap space monitoring on Linux
neuron.edge.swap-monitoring-enabled=true
# Maximum heap size recommendation for edge devices (MB)
neuron.edge.max-heap-mb=512

# ── Multi-Game Support (Phase 14+) ─────────────────────────────────────────────
# The default game server URL is used to auto-register a "default" game profile.
# Additional games can be registered via POST /api/v1/game/register.
# Each game has its own ONNX model, game server URL, and AI configuration.
# Multi-game management API: /api/v1/game/**
# Game routing: /game/{gameId}/** → routes to game-specific server

# ── Disaster Recovery (Phase 15+) ──────────────────────────────────────────────
# Experience persistence: saves unflushed samples to disk before sending to coordinator
# Persisted samples are replayed on restart if coordinator was unreachable
# Persistence file: backups/neuron/experience/pending.jsonl (JSON lines format)
# Recovery API: /api/v1/neuron/recovery/status
neuron.recovery.enabled=true
neuron.recovery.experience-persistence-enabled=true
neuron.recovery.model-verification-enabled=true
neuron.recovery.persistence-dir=backups/neuron/experience/

# ── Federation Failover (Phase 16+) ────────────────────────────────────────────
# Comma-separated list of fallback coordinator URLs for failover
neuron.coordinator-fallback-urls=
# Enable automatic failover to fallback coordinators
neuron.failover-enabled=true
# Interval for checking primary coordinator availability (milliseconds)
neuron.failover-check-interval-ms=30000

# ── Event-Driven Architecture (Phase 17+) ──────────────────────────────────────
# Kafka Configuration — enable for event-driven neuron communication
neuron.kafka.enabled=false
neuron.kafka.bootstrap-servers=localhost:9092
neuron.kafka.node-id=${neuron.node-id:neuron-default}
neuron.kafka.auto-offset-reset=latest

# ── AI Model Versioning (Phase 18+) ──────────────────────────────────────────────
# Model version control, A/B testing, and rollback capabilities
# The neuron automatically tracks the current model version and supports
# downloading specific versions for A/B test participation.
# Version query API: GET /api/v1/neuron/model/version
# Specific version download: POST /api/v1/neuron/model/version/{version}/download
