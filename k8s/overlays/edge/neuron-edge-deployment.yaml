# Edge Neuron Deployment — Kubernetes manifests for edge nodes
# Deployed on ARM64 nodes (Raspberry Pi, Jetson Nano, etc.)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuron-edge
  namespace: doramcu
  labels:
    app.kubernetes.io/name: neuron-edge
    app.kubernetes.io/component: satellite-ai-edge
    app.kubernetes.io/part-of: doramcu-neuron-network
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: neuron-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neuron-edge
        app.kubernetes.io/component: satellite-ai-edge
    spec:
      # Schedule on edge nodes with appropriate labels
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  # Match ARM64 architecture
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - arm64
                  # Match edge node role
                  - key: node-role.kubernetes.io/edge
                    operator: Exists
      # Tolerate edge node taints
      tolerations:
        - key: "node-role.kubernetes.io/edge"
          operator: "Exists"
          effect: "NoSchedule"
        # Tolerate NoSchedule taints on resource-constrained nodes
        - key: "workload"
          operator: "Equal"
          value: "edge"
          effect: "NoSchedule"
      containers:
        - name: neuron-edge
          image: doramcu/neuron-edge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: neuron-edge-config
          env:
            - name: NEURON_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NEURON_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          # Edge-optimized resource limits
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8090
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          # Mount quantized model directory
          volumeMounts:
            - name: quantized-models
              mountPath: /tmp/neuron-quantized-models
      volumes:
        - name: quantized-models
          emptyDir:
            sizeLimit: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: neuron-edge
  namespace: doramcu
  labels:
    app.kubernetes.io/name: neuron-edge
    app.kubernetes.io/component: satellite-ai-edge
    app.kubernetes.io/part-of: doramcu-neuron-network
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: neuron-edge
  ports:
    - name: http
      port: 8090
      targetPort: 8090
      protocol: TCP
