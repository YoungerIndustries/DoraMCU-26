# Kustomization — Production overlay
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # Full-scale neuron replicas for production
  - target:
      kind: HorizontalPodAutoscaler
      name: neuron-hpa
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 5
      - op: replace
        path: /spec/maxReplicas
        value: 50

  # Increase DoraMCU app replicas for high availability
  - target:
      kind: Deployment
      name: doramcu-app
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2

  # Increase resource quotas for production
  - target:
      kind: ResourceQuota
      name: doramcu-quota
    patch: |
      - op: replace
        path: /spec/hard/requests.cpu
        value: "32"
      - op: replace
        path: /spec/hard/requests.memory
        value: "64Gi"
      - op: replace
        path: /spec/hard/limits.cpu
        value: "64"
      - op: replace
        path: /spec/hard/limits.memory
        value: "128Gi"
      - op: replace
        path: /spec/hard/pods
        value: "100"

configMapGenerator:
  - name: neuron-config-production
    behavior: merge
    literals:
      - NEURON_NODE_REGION=production
      - NEURON_MESH_ENABLED="true"
      - NEURON_ENABLE_CONSENSUS="true"
      - NEURON_SECURITY_JWT_ENABLED="true"
      - NEURON_SECURITY_MODEL_SIGNATURE_ENABLED="true"

# Secrets must be injected by the CI/CD pipeline using an external secrets manager
# (e.g., HashiCorp Vault, AWS Secrets Manager, or Kubernetes External Secrets Operator).
# Do NOT commit real secrets to this file.
#
# Example: use a kustomize secret generator plugin or seal-secrets in your pipeline:
#   kustomize build k8s/overlays/production | kubeseal --format=yaml > sealed-secrets.yaml
#
# Required secret keys:
#   - db-password
#   - jwt-secret
#   - neuron-jwt-secret
#   - redis-password
#   - grafana-admin-password

images:
  - name: doramcu/app
    newName: doramcu/app
    newTag: "0.4.0"
  - name: doramcu/neuron
    newName: doramcu/neuron
    newTag: "0.4.0"
  - name: doramcu/dl-python
    newName: doramcu/dl-python
    newTag: "0.4.0"
