# OpenHands AI Service — DoraAI code generation and assistance
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doramcu-openhands
  namespace: doramcu
  labels:
    app.kubernetes.io/name: openhands
    app.kubernetes.io/component: ai-service
    app.kubernetes.io/part-of: doramcu-neuron-network
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openhands
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openhands
        app.kubernetes.io/component: ai-service
    spec:
      containers:
        - name: openhands
          image: doramcu/openhands:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          env:
            - name: DORA_SERVER_PORT
              value: "8082"
            - name: DORA_WORKSPACE
              value: "/workspace"
            - name: LLM_MODEL
              value: "ollama/qwen2.5:14b"
            - name: LLM_API_KEY
              value: "ollama"
            - name: LLM_BASE_URL
              value: "http://host.docker.internal:11434"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: app-source
              mountPath: /app
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: openhands-workspace-pvc
        - name: app-source
          persistentVolumeClaim:
            claimName: openhands-source-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openhands-workspace-pvc
  namespace: doramcu
  labels:
    app.kubernetes.io/name: openhands
    app.kubernetes.io/component: ai-service
    app.kubernetes.io/part-of: doramcu-neuron-network
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openhands-source-pvc
  namespace: doramcu
  labels:
    app.kubernetes.io/name: openhands
    app.kubernetes.io/component: ai-service
    app.kubernetes.io/part-of: doramcu-neuron-network
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: doramcu-openhands
  namespace: doramcu
  labels:
    app.kubernetes.io/name: openhands
    app.kubernetes.io/component: ai-service
    app.kubernetes.io/part-of: doramcu-neuron-network
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openhands
  ports:
    - name: http
      port: 8082
      targetPort: 8082
      protocol: TCP
