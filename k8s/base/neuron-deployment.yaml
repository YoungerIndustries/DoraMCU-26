# Neuron Node — Auto-scaling satellite AI nodes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuron
  namespace: doramcu
  labels:
    app.kubernetes.io/name: neuron
    app.kubernetes.io/component: satellite-ai
    app.kubernetes.io/part-of: doramcu-neuron-network
spec:
  # Replicas managed by HPA; initial value only
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: neuron
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neuron
        app.kubernetes.io/component: satellite-ai
    spec:
      containers:
        - name: neuron
          image: doramcu/neuron:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: neuron-config
          env:
            # Each pod gets a unique node name from its hostname
            - name: NEURON_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Auto-generate UUID for node ID
            - name: NEURON_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            # JWT secret from secrets
            - name: NEURON_SECURITY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: doramcu-secrets
                  key: neuron-jwt-secret
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8090
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health/live
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: neuron
  namespace: doramcu
  labels:
    app.kubernetes.io/name: neuron
    app.kubernetes.io/component: satellite-ai
    app.kubernetes.io/part-of: doramcu-neuron-network
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for direct pod access by mesh
  selector:
    app.kubernetes.io/name: neuron
  ports:
    - name: http
      port: 8090
      targetPort: 8090
      protocol: TCP
---
# Horizontal Pod Autoscaler for Neuron nodes
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neuron-hpa
  namespace: doramcu
  labels:
    app.kubernetes.io/name: neuron
    app.kubernetes.io/component: satellite-ai
    app.kubernetes.io/part-of: doramcu-neuron-network
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neuron
  minReplicas: 2
  maxReplicas: 20
  metrics:
    # Scale based on CPU utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Scale based on memory utilization
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # Scale based on custom Prometheus metrics (when available)
    - type: Pods
      pods:
        metric:
          name: neuron_http_requests_per_second
        target:
          type: AverageValue
          averageValue: "100"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
