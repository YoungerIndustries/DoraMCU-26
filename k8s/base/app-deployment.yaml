# DoraMCU Main Application (Coordinator)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doramcu-app
  namespace: doramcu
  labels:
    app.kubernetes.io/name: doramcu-app
    app.kubernetes.io/component: coordinator
    app.kubernetes.io/part-of: doramcu-neuron-network
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: doramcu-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: doramcu-app
        app.kubernetes.io/component: coordinator
    spec:
      containers:
        - name: app
          image: doramcu/app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
              protocol: TCP
            - name: redirect
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: doramcu-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: doramcu-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: doramcu-secrets
                  key: jwt-secret
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health/live
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: doramcu-app
  namespace: doramcu
  labels:
    app.kubernetes.io/name: doramcu-app
    app.kubernetes.io/component: coordinator
    app.kubernetes.io/part-of: doramcu-neuron-network
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: doramcu-app
  ports:
    - name: http
      port: 8084
      targetPort: 8084
      protocol: TCP
    - name: redirect
      port: 8080
      targetPort: 8080
      protocol: TCP
