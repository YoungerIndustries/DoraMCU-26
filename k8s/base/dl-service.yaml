# Python DL Service — Deep Learning training and ONNX export
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doramcu-dl
  namespace: doramcu
  labels:
    app.kubernetes.io/name: dl
    app.kubernetes.io/component: deep-learning
    app.kubernetes.io/part-of: doramcu-neuron-network
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dl
        app.kubernetes.io/component: deep-learning
    spec:
      containers:
        - name: dl
          image: doramcu/dl-python:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          env:
            - name: DORA_DL_PORT
              value: "8083"
            - name: DL_MODEL_DIR
              value: "/app/dl-models"
            - name: DL_BLEND_FACTOR
              value: "0.5"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          # GPU support — requires NVIDIA device plugin
          # resources:
          #   limits:
          #     nvidia.com/gpu: 1
          volumeMounts:
            - name: dl-models
              mountPath: /app/dl-models
      volumes:
        - name: dl-models
          persistentVolumeClaim:
            claimName: dl-models-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dl-models-pvc
  namespace: doramcu
  labels:
    app.kubernetes.io/name: dl
    app.kubernetes.io/component: deep-learning
    app.kubernetes.io/part-of: doramcu-neuron-network
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: doramcu-dl
  namespace: doramcu
  labels:
    app.kubernetes.io/name: dl
    app.kubernetes.io/component: deep-learning
    app.kubernetes.io/part-of: doramcu-neuron-network
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dl
  ports:
    - name: http
      port: 8083
      targetPort: 8083
      protocol: TCP
