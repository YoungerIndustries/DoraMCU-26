# Ingress — Public access to Neuron gateway and game server
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: doramcu-ingress
  namespace: doramcu
  labels:
    app.kubernetes.io/name: doramcu-ingress
    app.kubernetes.io/part-of: doramcu-neuron-network
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # SSE support for game streaming
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  # TLS configuration — uncomment and configure for production
  # tls:
  #   - hosts:
  #       - doramcu.example.com
  #     secretName: doramcu-tls-secret
  rules:
    # Neuron web gateway — public entry point for game players
    - host: neuron.doramcu.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: neuron
                port:
                  number: 8090
    # Game server direct access
    - host: game.doramcu.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: doramcu-app
                port:
                  number: 8084
    # Prometheus metrics (internal only)
    - host: metrics.doramcu.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
    # Grafana dashboards (internal only)
    - host: grafana.doramcu.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
