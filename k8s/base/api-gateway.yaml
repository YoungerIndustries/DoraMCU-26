# API Gateway for multi-process galaxy architecture
# Routes requests to the appropriate galaxy worker based on galaxy ID
apiVersion: v1
kind: ConfigMap
metadata:
  name: doramcu-gateway-config
  namespace: doramcu
data:
  # Gateway routing rules
  gateway.routes: |
    # Galaxy-specific routes - routed to galaxy workers by galaxy ID
    /api/galaxies/{galaxyId}/    ->  doramcu-galaxy-worker.{galaxyId}:8080
    /api/galaxies/{galaxyName}/  ->  doramcu-galaxy-worker.{galaxyName}:8080
    
    # Global routes - handled by coordinator
    /api/health/                  ->  doramcu-app:8084
    /api/admin/                   ->  doramcu-app:8084
    /api/galaxies/                ->  doramcu-app:8084
    
    # Event streaming - handled by gateway with Redis pub/sub
    /api/events/stream            ->  doramcu-gateway:8080
---
# API Gateway Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doramcu-gateway
  namespace: doramcu
  labels:
    app.kubernetes.io/name: doramcu-gateway
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: doramcu-neuron-network
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: doramcu-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: doramcu-gateway
        app.kubernetes.io/component: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: gateway
          image: doramcu/app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: doramcu-config
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "mysql,gateway"
            - name: DORAMCU_EVENT_REDIS_ENABLED
              value: "true"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: doramcu-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: doramcu-secrets
                  key: jwt-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
# API Gateway Service
apiVersion: v1
kind: Service
metadata:
  name: doramcu-gateway
  namespace: doramcu
  labels:
    app.kubernetes.io/name: doramcu-gateway
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: doramcu-neuron-network
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: doramcu-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
# Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: doramcu-gateway-ingress
  namespace: doramcu
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: doramcu.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: doramcu-gateway
                port:
                  number: 8080
